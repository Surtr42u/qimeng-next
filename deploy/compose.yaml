services:
  server:
    image: alpine:3.24.4@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
    user: "${QIMENG_PACKAGE_UID:?run start.sh nas}:${QIMENG_PACKAGE_GID:?run start.sh nas}"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    entrypoint: ["/bin/sh", "/opt/qimeng/nas-entry.sh"]
    ports: ["127.0.0.1:${QIMENG_PACKAGE_PORT:-8421}:8421"]
    secrets: [admin_password]
    tmpfs: [/tmp]
    volumes:
      - type: bind
        source: "${QIMENG_PACKAGE_APP:?run start.sh nas}"
        target: /opt/qimeng
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: "${QIMENG_PACKAGE_DATA:?run start.sh nas}"
        target: /var/lib/qimeng
        bind: {create_host_path: false}
      - type: bind
        source: "${QIMENG_PACKAGE_MEDIA:?run start.sh nas}"
        target: /media/qimeng
        bind: {create_host_path: false}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8421/healthz"]
      interval: 20s
      timeout: 5s
      retries: 3
secrets:
  admin_password:
    file: "${QIMENG_PACKAGE_SECRET:?run start.sh nas}"
