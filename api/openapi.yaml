        sourceRelativePath: {type: string, maxLength: 4096, description: Source-relative clue only; absolute paths and traversal are rejected}
        size: {type: integer, format: int64, minimum: 1}
        mimeType: {type: string, description: Provider MIME declaration; application/octet-stream explicitly means unknown. Go normalizes compatible aliases and verifies actual bytes before publication.}
        expectedHash: {type: string, pattern: '^[0-9a-fA-F]{64}$', description: Optional complete source SHA-256 snapshot. When provided the server must match it before staging or publishing.}
        mode: {type: string, enum: [ordinary, intelligent]}
        batchId: {type: string}
        inputId: {type: string, description: Required for an explicit batch; references its previously sealed original input manifest}
        sourceMtime: {type: string, format: date-time}
        relativeDirectory: {type: string, maxLength: 500}
        authorId: {type: string}
        authorIds: {type: array, maxItems: 20, items: {type: string}}
        collectionId: {type: string}
        cosWorkId: {type: string, description: Existing COS directory work; determines its registered directory and primary directory author}
        note: {type: string, maxLength: 10000}
