openapi: 3.0.3
info:
  title: Qimeng Next API
  version: 0.1.0
  description: Single-user media authority. All writes use server revisions; AI credentials are bound to one intake batch.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
  - sessionCookie: []
paths:
  /instance:
    get:
      operationId: getInstance
      security: []
      responses:
        '200': {description: Instance, content: {application/json: {schema: {$ref: '#/components/schemas/Instance'}}}}
  /sessions:
    post:
      operationId: createSession
      security: []
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SessionCreate'}}}}
      responses:
        '201': {description: Session and HttpOnly cookie, content: {application/json: {schema: {$ref: '#/components/schemas/Session'}}}}
        default: {$ref: '#/components/responses/Error'}
  /sessions/current:
    get:
      operationId: getCurrentSession
      responses:
        '200': {description: Session without secret, content: {application/json: {schema: {$ref: '#/components/schemas/Session'}}}}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteCurrentSession
      responses:
        '204': {description: Session revoked}
        default: {$ref: '#/components/responses/Error'}
  /credentials:
    post:
      operationId: createCredential
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CredentialCreate'}}}}
      responses:
        '201': {description: Batch-bound credential, content: {application/json: {schema: {$ref: '#/components/schemas/Session'}}}}
        default: {$ref: '#/components/responses/Error'}
  /credentials/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    delete:
      operationId: revokeCredential
      responses:
        '204': {description: Revoked}
        default: {$ref: '#/components/responses/Error'}
  /storages:
    get:
      operationId: listStorages
      responses:
        '200': {description: Trusted logical storage roots without host paths, content: {application/json: {schema: {$ref: '#/components/schemas/StoragePage'}}}}
        default: {$ref: '#/components/responses/Error'}
  /storages/resolve-library-root:
    post:
      operationId: resolveLibraryRoot
      description: Owner UI only. Resolves the existing absolute-root text field into a preconfigured logical storage and relative path. Does not create directories or expand filesystem authority. Never exposed to model tools.
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [rootPath], properties: {rootPath: {type: string, minLength: 1, maxLength: 4096}}}}}}
      responses:
        '200': {description: Authorized location, content: {application/json: {schema: {$ref: '#/components/schemas/LibraryLocation'}}}}
        default: {$ref: '#/components/responses/Error'}
  /libraries/{id}/location:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      operationId: getLibraryLocation
      description: Owner UI only; physical paths are excluded from general library responses and model tools.
      responses:
        '200': {description: Registered location, content: {application/json: {schema: {$ref: '#/components/schemas/LibraryLocation'}}}}
        default: {$ref: '#/components/responses/Error'}
  /libraries:
    get:
      operationId: listLibraries
      responses:
        '200': {description: Libraries, content: {application/json: {schema: {$ref: '#/components/schemas/LibraryPage'}}}}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createLibrary
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LibraryCreate'}}}}
      responses:
        '201': {description: Library, content: {application/json: {schema: {$ref: '#/components/schemas/Library'}}}}
        default: {$ref: '#/components/responses/Error'}
  /libraries/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    patch:
      operationId: updateLibrary
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LibraryUpdate'}}}}
      responses:
        '200': {description: Library, content: {application/json: {schema: {$ref: '#/components/schemas/Library'}}}}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteLibrary
      description: Unregister this library and remove its media index. Original files, event identities and completed intake receipts are preserved. Resolve trash and active operations before detaching.
      parameters: [{$ref: '#/components/parameters/ExpectedRevision'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '204': {description: Library index removed}
        default: {$ref: '#/components/responses/Error'}
  /libraries/{id}/directories:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      operationId: listDirectories
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
        - {name: parent, in: query, schema: {type: string}}
      responses:
        '200': {description: Direct child directories, content: {application/json: {schema: {$ref: '#/components/schemas/DirectoryPage'}}}}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createDirectory
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [relativePath], properties: {relativePath: {type: string}}}}}}
      responses:
        '201': {description: Directory, content: {application/json: {schema: {$ref: '#/components/schemas/Directory'}}}}
        default: {$ref: '#/components/responses/Error'}
  /libraries/{id}/naming/context:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      operationId: getNamingContext
      description: >-
        读取后端权威命名范围、下一作品号或补页/短剧章节及命名空间摘要。
        编号由Go按既有规则计算；AI无需遍历目录找最大编号。返回值不预留编号，发布时重新核验。
      parameters:
        - {name: directory, in: query, schema: {type: string}}
        - {name: family, in: query, schema: {type: string}}
        - {name: mediaType, in: query, schema: {type: string, enum: [image, animated_image, video], default: image}}
        - {name: collectionId, in: query, schema: {type: string}}
      responses:
        '200': {description: Deterministic naming scope; no number reservation, content: {application/json: {schema: {$ref: '#/components/schemas/NamingContext'}}}}
        default: {$ref: '#/components/responses/Error'}
  /libraries/{id}/naming/suggestions:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      operationId: suggestNames
      description: >-
        为人工输入和AI提供同源的作品名补全，最多返回八个真实命名范围候选。
        多候选不能默认选第一项；名称相似或数字后缀本身不证明作品同组。
      parameters:
        - {name: directory, in: query, schema: {type: string}}
        - {name: q, in: query, schema: {type: string, maxLength: 200}}
        - {name: mediaType, in: query, schema: {type: string, enum: [image, animated_image, video], default: image}}
      responses:
        '200': {description: Up to eight suggestions from the authoritative namespace, content: {application/json: {schema: {$ref: '#/components/schemas/NameSuggestionList'}}}}
        default: {$ref: '#/components/responses/Error'}
  /libraries/{id}/naming/preview:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      operationId: previewNames
      description: >-
        只读预览新作品、已有组图补页、短剧追加或精确改名。
        提交出处/角色稳定ID、集合及明确分组意图，由Go生成规范名称和编号。
        不修改媒体、不预留编号；正式接收或计划仍提交原意图，由同一用例在发布时重验。
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/NamingPreviewInput'}}}}
      responses:
        '200': {description: Complete preview; publication rechecks namespace and object revisions, content: {application/json: {schema: {$ref: '#/components/schemas/NamingPreview'}}}}
        default: {$ref: '#/components/responses/Error'}
  /libraries/{id}/scans:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      operationId: startLibraryScan
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RevisionRequest'}}}}
      responses:
        '202': {description: Persisted scan job; registration is not scan completion, content: {application/json: {schema: {$ref: '#/components/schemas/ScanJob'}}}}
        default: {$ref: '#/components/responses/Error'}
  /scans:
    get:
      operationId: listLibraryScans
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
        - {name: libraryId, in: query, schema: {type: string}}
        - {name: state, in: query, schema: {type: string}}
      responses:
        '200': {description: Durable scan jobs across devices, content: {application/json: {schema: {$ref: '#/components/schemas/ScanPage'}}}}
        default: {$ref: '#/components/responses/Error'}
  /scans/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      operationId: getLibraryScan
      responses:
        '200': {description: Durable scan progress with bounded diagnostics, content: {application/json: {schema: {$ref: '#/components/schemas/ScanJob'}}}}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: cancelLibraryScan
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '200': {description: Cancel future indexing; committed items remain, content: {application/json: {schema: {$ref: '#/components/schemas/ScanJob'}}}}
        default: {$ref: '#/components/responses/Error'}
  /assets:
    get:
      operationId: listAssets
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
        - {name: libraryId, in: query, schema: {type: string}}
        - {name: q, in: query, schema: {type: string, maxLength: 200}}
        - {name: mediaType, in: query, schema: {type: string, enum: [image, animated_image, video]}}
        - {name: kind, in: query, schema: {type: string, enum: [regular, cos]}}
        - {name: authorId, in: query, schema: {type: string}}
        - {name: collectionId, in: query, schema: {type: string}}
        - {$ref: '#/components/parameters/FixedTag'}
        - {$ref: '#/components/parameters/DirectoryFilter'}
        - {$ref: '#/components/parameters/RecursiveFilter'}
        - {$ref: '#/components/parameters/IncludeDisabled'}
        - {name: favorite, in: query, schema: {type: boolean}}
        - {name: liked, in: query, schema: {type: boolean}}
        - {$ref: '#/components/parameters/ViewRange'}
        - {$ref: '#/components/parameters/PlayRange'}
        - {$ref: '#/components/parameters/SizeRange'}
        - {name: dateCounts, in: query, schema: {type: boolean, default: false}, description: 'Compute exact file-date buckets only on the first page; omitted on continuation pages'}
        - {$ref: '#/components/parameters/TZOffsetMinutes'}
        - {$ref: '#/components/parameters/AssetSort'}
        - {$ref: '#/components/parameters/AssetOrder'}
        - {$ref: '#/components/parameters/AuthorIDs'}
        - {$ref: '#/components/parameters/SourceIDs'}
        - {$ref: '#/components/parameters/CharacterIDs'}
        - {$ref: '#/components/parameters/CosWorkIDs'}
        - {$ref: '#/components/parameters/WorkKeys'}
        - {$ref: '#/components/parameters/RoleKeys'}
        - {$ref: '#/components/parameters/TagNames'}
        - {$ref: '#/components/parameters/TagMode'}
        - {$ref: '#/components/parameters/HistorySubset'}
        - {$ref: '#/components/parameters/MinimumViews'}
        - {$ref: '#/components/parameters/MaximumViews'}
        - {$ref: '#/components/parameters/MinimumPlays'}
        - {$ref: '#/components/parameters/MaximumPlays'}
        - {$ref: '#/components/parameters/MinimumSize'}
        - {$ref: '#/components/parameters/MaximumSize'}
        - {$ref: '#/components/parameters/TimeRange'}
        - {$ref: '#/components/parameters/FromYear'}
        - {$ref: '#/components/parameters/ToYear'}
      responses:
        '200': {description: Media page, content: {application/json: {schema: {$ref: '#/components/schemas/AssetPage'}}}}
        default: {$ref: '#/components/responses/Error'}
  /assets/facets:
    get:
      operationId: getAssetFacets
      description: Counts use exactly the asset search/filter predicate. Clients omit the current row's selected keys when requesting that row; fixed authorId, favorite and history constraints remain. Opaque workKeys/roleKeys preserve OR between regular and COS choices in the same visual row.
      parameters:
        - {name: row, in: query, required: true, schema: {type: string, enum: [partitions, works, roles, types]}}
        - {$ref: '#/components/parameters/TZOffsetMinutes'}
        - {$ref: '#/components/parameters/ViewRange'}
        - {$ref: '#/components/parameters/PlayRange'}
        - {$ref: '#/components/parameters/SizeRange'}
        - {name: libraryId, in: query, schema: {type: string}}
        - {name: q, in: query, schema: {type: string, maxLength: 200}}
        - {name: facetQ, in: query, schema: {type: string, maxLength: 200}}
        - {$ref: '#/components/parameters/FixedTag'}
        - {$ref: '#/components/parameters/DirectoryFilter'}
        - {$ref: '#/components/parameters/RecursiveFilter'}
        - {$ref: '#/components/parameters/IncludeDisabled'}
        - {name: kind, in: query, schema: {type: string, enum: [regular, cos]}}
        - {name: mediaType, in: query, schema: {type: string, enum: [image, animated_image, video]}}
        - {name: authorId, in: query, schema: {type: string}}
        - {name: collectionId, in: query, schema: {type: string}}
        - {name: favorite, in: query, schema: {type: boolean}}
        - {name: liked, in: query, schema: {type: boolean}}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/AuthorIDs'}
        - {$ref: '#/components/parameters/SourceIDs'}
        - {$ref: '#/components/parameters/CharacterIDs'}
        - {$ref: '#/components/parameters/CosWorkIDs'}
        - {$ref: '#/components/parameters/WorkKeys'}
        - {$ref: '#/components/parameters/RoleKeys'}
        - {$ref: '#/components/parameters/TagNames'}
        - {$ref: '#/components/parameters/TagMode'}
        - {$ref: '#/components/parameters/HistorySubset'}
        - {$ref: '#/components/parameters/MinimumViews'}
        - {$ref: '#/components/parameters/MaximumViews'}
        - {$ref: '#/components/parameters/MinimumPlays'}
        - {$ref: '#/components/parameters/MaximumPlays'}
        - {$ref: '#/components/parameters/MinimumSize'}
        - {$ref: '#/components/parameters/MaximumSize'}
        - {$ref: '#/components/parameters/TimeRange'}
        - {$ref: '#/components/parameters/FromYear'}
        - {$ref: '#/components/parameters/ToYear'}
      responses:
        '200': {description: Exact bounded facet candidates and matching asset count, content: {application/json: {schema: {$ref: '#/components/schemas/AssetFacetPage'}}}}
        default: {$ref: '#/components/responses/Error'}
  /search/suggestions:
    get:
      operationId: getSearchSuggestions
      parameters:
        - {name: q, in: query, schema: {type: string, maxLength: 200}}
        - {name: recommend, in: query, schema: {type: boolean, default: false}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 10}}
      responses:
        '200': {description: Five real indexed dimensions; empty q requires recommend=true for a fresh mixed random batch, content: {application/json: {schema: {$ref: '#/components/schemas/SearchSuggestionList'}}}}
        default: {$ref: '#/components/responses/Error'}
  /cos-works:
    get:
      operationId: listCosWorks
      parameters:
        - {name: libraryId, in: query, schema: {type: string}}
        - {name: authorId, in: query, schema: {type: string}}
        - {name: q, in: query, schema: {type: string}}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200': {description: Persistent COS directory work identities, content: {application/json: {schema: {$ref: '#/components/schemas/CosWorkPage'}}}}
        default: {$ref: '#/components/responses/Error'}
  /assets/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      operationId: getAsset
      responses:
        '200': {description: Asset, content: {application/json: {schema: {$ref: '#/components/schemas/Asset'}}}}
        default: {$ref: '#/components/responses/Error'}
    patch:
      operationId: updateAsset
      parameters:
        - {name: Idempotency-Key, in: header, required: false, schema: {type: string, minLength: 8, maxLength: 128}, description: Required when newAuthorNames is non-empty so author creation and relationship replacement share one replay identity}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AssetUpdate'}}}}
      responses:
        '200': {description: Asset, content: {application/json: {schema: {$ref: '#/components/schemas/Asset'}}}}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: trashAsset
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {name: expectedRevision, in: query, required: true, schema: {type: integer, format: int64}}
      responses:
        '200': {description: Trashed asset, content: {application/json: {schema: {$ref: '#/components/schemas/Asset'}}}}
        default: {$ref: '#/components/responses/Error'}
  /assets/{id}/content:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      operationId: getAssetContent
      parameters:
        - {name: Range, in: header, schema: {type: string}}
        - {name: version, in: query, schema: {type: integer, format: int64, minimum: 1}, description: Reject with 409 when the captured content version has changed}
      responses:
        '200': {description: Original bytes, content: {application/octet-stream: {schema: {type: string, format: binary}}}}
        '206': {description: Byte range, content: {application/octet-stream: {schema: {type: string, format: binary}}}}
        default: {$ref: '#/components/responses/Error'}
  /assets/{id}/thumbnail:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      operationId: getAssetThumbnail
      parameters:
        - {name: version, in: query, schema: {type: integer, format: int64, minimum: 1}, description: Reject with 409 rather than cache new bytes as an older version}
        - {name: size, in: query, schema: {type: string, enum: [sm, md, lg], default: md}, description: Preview long edge 256/512/1024; never changes original media}
      responses:
        '200': {description: Versioned bounded JPEG preview, content: {image/jpeg: {schema: {type: string, format: binary}}}}
        default: {$ref: '#/components/responses/Error'}
  /assets/{id}/tags:
    parameters: [{$ref: '#/components/parameters/Id'}]
    put:
      operationId: updateAssetTags
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TagsUpdate'}}}}
      responses:
        '200': {description: Asset, content: {application/json: {schema: {$ref: '#/components/schemas/Asset'}}}}
        default: {$ref: '#/components/responses/Error'}
  /assets/{id}/reaction:
    parameters: [{$ref: '#/components/parameters/Id'}]
    put:
      operationId: updateReaction
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReactionUpdate'}}}}
      responses:
        '200': {description: Asset, content: {application/json: {schema: {$ref: '#/components/schemas/Asset'}}}}
        default: {$ref: '#/components/responses/Error'}
  /assets/{id}/events:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      operationId: recordEvent
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/EventCreate'}}}}
      responses:
        '200': {description: Saved event, content: {application/json: {schema: {$ref: '#/components/schemas/HistoryEvent'}}}}
        default: {$ref: '#/components/responses/Error'}
  /assets/{id}/move:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      operationId: moveAsset
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MoveRequest'}}}}
      responses:
        '200': {description: Moved asset, content: {application/json: {schema: {$ref: '#/components/schemas/Asset'}}}}
        default: {$ref: '#/components/responses/Error'}
  /tags:
    get:
      operationId: listTags
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {description: Active tag vocabulary, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {type: string}}, nextCursor: {type: string}}}}}}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createTag
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [name], properties: {name: {type: string, maxLength: 100}}}}}}
      responses:
        '201': {description: Tag, content: {application/json: {schema: {$ref: '#/components/schemas/Tag'}}}}
        default: {$ref: '#/components/responses/Error'}
  /tag-vocabulary:
    get:
      operationId: listTagVocabulary
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {description: Versioned active vocabulary, content: {application/json: {schema: {$ref: '#/components/schemas/TagPage'}}}}
        default: {$ref: '#/components/responses/Error'}
  /tags/{tag}:
    parameters: [{name: tag, in: path, required: true, schema: {type: string}}]
    patch:
      operationId: renameTag
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [name, expectedRevision], properties: {name: {type: string, maxLength: 100}, expectedRevision: {type: integer, format: int64}}}}}}
      responses:
        '200': {description: Renamed vocabulary and all affected associations atomically, content: {application/json: {schema: {$ref: '#/components/schemas/Tag'}}}}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteTag
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/ExpectedRevision'}]
      responses:
        '204': {description: Tag deleted and removed from all assets; revisions prevent stale resurrection}
        default: {$ref: '#/components/responses/Error'}
  /assets/{id}/tags/{tag}:
    parameters: [{$ref: '#/components/parameters/Id'}, {name: tag, in: path, required: true, schema: {type: string}}]
    delete:
      operationId: removeAssetTag
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/ExpectedRevision'}]
      responses:
        '200': {description: Asset after removing only the selected association, content: {application/json: {schema: {$ref: '#/components/schemas/Asset'}}}}
        default: {$ref: '#/components/responses/Error'}
  /assets/{id}/timeline:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      operationId: listTimelineMarks
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {description: Marks including preserved older content versions, content: {application/json: {schema: {$ref: '#/components/schemas/TimelinePage'}}}}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createTimelineMark
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TimelineInput'}}}}
      responses:
        '201': {description: Mark, content: {application/json: {schema: {$ref: '#/components/schemas/TimelineMark'}}}}
        default: {$ref: '#/components/responses/Error'}
  /assets/{id}/timeline/{markId}:
    parameters: [{$ref: '#/components/parameters/Id'}, {name: markId, in: path, required: true, schema: {type: string}}]
    put:
      operationId: updateTimelineMark
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TimelineInput'}}}}
      responses:
        '200': {description: Revised mark, content: {application/json: {schema: {$ref: '#/components/schemas/TimelineMark'}}}}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteTimelineMark
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/ExpectedRevision'}]
      responses:
        '204': {description: Mark deleted}
        default: {$ref: '#/components/responses/Error'}
  /sources:
    get:
      operationId: listSources
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}, {name: q, in: query, schema: {type: string}}]
      responses:
        '200': {description: Stable source identities and aliases, content: {application/json: {schema: {$ref: '#/components/schemas/SourcePage'}}}}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createSource
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
