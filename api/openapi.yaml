openapi: 3.0.3
info:
  title: Qimeng Next API
  version: 0.1.0
  description: Single-user media authority. All writes use server revisions; AI credentials are bound to one intake batch.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
  - sessionCookie: []
paths:
  /instance:
    get:
      operationId: getInstance
      security: []
      responses:
        '200': {description: Instance, content: {application/json: {schema: {$ref: '#/components/schemas/Instance'}}}}
  /sessions:
    post:
      operationId: createSession
      security: []
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SessionCreate'}}}}
      responses:
        '201': {description: Session and HttpOnly cookie, content: {application/json: {schema: {$ref: '#/components/schemas/Session'}}}}
        default: {$ref: '#/components/responses/Error'}
  /sessions/current:
    get:
      operationId: getCurrentSession
      responses:
        '200': {description: Session without secret, content: {application/json: {schema: {$ref: '#/components/schemas/Session'}}}}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteCurrentSession
      responses:
        '204': {description: Session revoked}
        default: {$ref: '#/components/responses/Error'}
  /credentials:
    post:
      operationId: createCredential
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CredentialCreate'}}}}
      responses:
        '201': {description: Batch-bound credential, content: {application/json: {schema: {$ref: '#/components/schemas/Session'}}}}
        default: {$ref: '#/components/responses/Error'}
  /credentials/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    delete:
      operationId: revokeCredential
      responses:
        '204': {description: Revoked}
        default: {$ref: '#/components/responses/Error'}
  /libraries:
    get:
      operationId: listLibraries
      responses:
        '200': {description: Libraries, content: {application/json: {schema: {$ref: '#/components/schemas/LibraryPage'}}}}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createLibrary
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LibraryCreate'}}}}
      responses:
        '201': {description: Library, content: {application/json: {schema: {$ref: '#/components/schemas/Library'}}}}
        default: {$ref: '#/components/responses/Error'}
  /libraries/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    patch:
      operationId: updateLibrary
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LibraryUpdate'}}}}
      responses:
        '200': {description: Library, content: {application/json: {schema: {$ref: '#/components/schemas/Library'}}}}
        default: {$ref: '#/components/responses/Error'}
  /libraries/{id}/directories:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      operationId: listDirectories
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
        - {name: parent, in: query, schema: {type: string}}
      responses:
        '200': {description: Direct child directories, content: {application/json: {schema: {$ref: '#/components/schemas/DirectoryPage'}}}}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createDirectory
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [relativePath], properties: {relativePath: {type: string}}}}}}
      responses:
        '201': {description: Directory, content: {application/json: {schema: {$ref: '#/components/schemas/Directory'}}}}
        default: {$ref: '#/components/responses/Error'}
  /assets:
    get:
      operationId: listAssets
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
        - {name: libraryId, in: query, schema: {type: string}}
        - {name: q, in: query, schema: {type: string, maxLength: 200}}
        - {name: mediaType, in: query, schema: {type: string, enum: [image, animated_image, video]}}
        - {name: kind, in: query, schema: {type: string, enum: [regular, cos]}}
        - {name: authorId, in: query, schema: {type: string}}
        - {name: collectionId, in: query, schema: {type: string}}
        - {name: tag, in: query, schema: {type: string}}
        - {name: favorite, in: query, schema: {type: boolean}}
        - {name: liked, in: query, schema: {type: boolean}}
        - {name: sort, in: query, schema: {type: string, enum: [added_desc, updated_desc, name_asc], default: added_desc}}
      responses:
        '200': {description: Media page, content: {application/json: {schema: {$ref: '#/components/schemas/AssetPage'}}}}
        default: {$ref: '#/components/responses/Error'}
  /assets/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      operationId: getAsset
      responses:
        '200': {description: Asset, content: {application/json: {schema: {$ref: '#/components/schemas/Asset'}}}}
        default: {$ref: '#/components/responses/Error'}
    patch:
      operationId: updateAsset
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AssetUpdate'}}}}
      responses:
        '200': {description: Asset, content: {application/json: {schema: {$ref: '#/components/schemas/Asset'}}}}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: trashAsset
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {name: expectedRevision, in: query, required: true, schema: {type: integer, format: int64}}
      responses:
        '200': {description: Trashed asset, content: {application/json: {schema: {$ref: '#/components/schemas/Asset'}}}}
        default: {$ref: '#/components/responses/Error'}
  /assets/{id}/content:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      operationId: getAssetContent
      parameters: [{name: Range, in: header, schema: {type: string}}]
      responses:
        '200': {description: Original bytes, content: {application/octet-stream: {schema: {type: string, format: binary}}}}
        '206': {description: Byte range, content: {application/octet-stream: {schema: {type: string, format: binary}}}}
        default: {$ref: '#/components/responses/Error'}
  /assets/{id}/thumbnail:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      operationId: getAssetThumbnail
      responses:
        '200': {description: Versioned bounded JPEG preview, content: {image/jpeg: {schema: {type: string, format: binary}}}}
        default: {$ref: '#/components/responses/Error'}
  /assets/{id}/tags:
    parameters: [{$ref: '#/components/parameters/Id'}]
    put:
      operationId: updateAssetTags
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TagsUpdate'}}}}
      responses:
        '200': {description: Asset, content: {application/json: {schema: {$ref: '#/components/schemas/Asset'}}}}
        default: {$ref: '#/components/responses/Error'}
  /assets/{id}/reaction:
    parameters: [{$ref: '#/components/parameters/Id'}]
    put:
      operationId: updateReaction
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReactionUpdate'}}}}
      responses:
        '200': {description: Asset, content: {application/json: {schema: {$ref: '#/components/schemas/Asset'}}}}
        default: {$ref: '#/components/responses/Error'}
  /assets/{id}/events:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      operationId: recordEvent
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/EventCreate'}}}}
      responses:
        '200': {description: Saved event, content: {application/json: {schema: {$ref: '#/components/schemas/HistoryEvent'}}}}
        default: {$ref: '#/components/responses/Error'}
  /assets/{id}/move:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      operationId: moveAsset
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MoveRequest'}}}}
      responses:
        '200': {description: Moved asset, content: {application/json: {schema: {$ref: '#/components/schemas/Asset'}}}}
        default: {$ref: '#/components/responses/Error'}
  /tags:
    get:
      operationId: listTags
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {description: Active tag vocabulary, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {type: string}}, nextCursor: {type: string}}}}}}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createTag
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [name], properties: {name: {type: string, maxLength: 100}}}}}}
      responses:
        '201': {description: Tag, content: {application/json: {schema: {$ref: '#/components/schemas/Tag'}}}}
        default: {$ref: '#/components/responses/Error'}
  /tag-vocabulary:
    get:
      operationId: listTagVocabulary
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {description: Versioned active vocabulary, content: {application/json: {schema: {$ref: '#/components/schemas/TagPage'}}}}
        default: {$ref: '#/components/responses/Error'}
  /tags/{tag}:
    parameters: [{name: tag, in: path, required: true, schema: {type: string}}]
    patch:
      operationId: renameTag
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [name, expectedRevision], properties: {name: {type: string, maxLength: 100}, expectedRevision: {type: integer, format: int64}}}}}}
      responses:
        '200': {description: Renamed vocabulary and all affected associations atomically, content: {application/json: {schema: {$ref: '#/components/schemas/Tag'}}}}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteTag
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/ExpectedRevision'}]
      responses:
        '204': {description: Tag deleted and removed from all assets; revisions prevent stale resurrection}
        default: {$ref: '#/components/responses/Error'}
  /assets/{id}/tags/{tag}:
    parameters: [{$ref: '#/components/parameters/Id'}, {name: tag, in: path, required: true, schema: {type: string}}]
    delete:
      operationId: removeAssetTag
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/ExpectedRevision'}]
      responses:
        '200': {description: Asset after removing only the selected association, content: {application/json: {schema: {$ref: '#/components/schemas/Asset'}}}}
        default: {$ref: '#/components/responses/Error'}
  /assets/{id}/timeline:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      operationId: listTimelineMarks
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {description: Marks including preserved older content versions, content: {application/json: {schema: {$ref: '#/components/schemas/TimelinePage'}}}}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createTimelineMark
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TimelineInput'}}}}
      responses:
        '201': {description: Mark, content: {application/json: {schema: {$ref: '#/components/schemas/TimelineMark'}}}}
        default: {$ref: '#/components/responses/Error'}
  /assets/{id}/timeline/{markId}:
    parameters: [{$ref: '#/components/parameters/Id'}, {name: markId, in: path, required: true, schema: {type: string}}]
    put:
      operationId: updateTimelineMark
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TimelineInput'}}}}
      responses:
        '200': {description: Revised mark, content: {application/json: {schema: {$ref: '#/components/schemas/TimelineMark'}}}}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteTimelineMark
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/ExpectedRevision'}]
      responses:
        '204': {description: Mark deleted}
        default: {$ref: '#/components/responses/Error'}
  /sources:
    get:
      operationId: listSources
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}, {name: q, in: query, schema: {type: string}}]
      responses:
        '200': {description: Stable source identities and aliases, content: {application/json: {schema: {$ref: '#/components/schemas/SourcePage'}}}}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createSource
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TermInput'}}}}
      responses:
        '201': {description: Source, content: {application/json: {schema: {$ref: '#/components/schemas/Source'}}}}
        default: {$ref: '#/components/responses/Error'}
  /sources/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    put:
      operationId: updateSource
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TermInput'}}}}
      responses:
        '200': {description: Source, content: {application/json: {schema: {$ref: '#/components/schemas/Source'}}}}
        default: {$ref: '#/components/responses/Error'}
  /characters:
    get:
      operationId: listCharacters
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}, {name: q, in: query, schema: {type: string}}, {name: sourceId, in: query, schema: {type: string}}]
      responses:
        '200': {description: Stable character identities, content: {application/json: {schema: {$ref: '#/components/schemas/CharacterPage'}}}}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createCharacter
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TermInput'}}}}
      responses:
        '201': {description: Character, content: {application/json: {schema: {$ref: '#/components/schemas/Character'}}}}
        default: {$ref: '#/components/responses/Error'}
  /characters/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    put:
      operationId: updateCharacter
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TermInput'}}}}
      responses:
        '200': {description: Character, content: {application/json: {schema: {$ref: '#/components/schemas/Character'}}}}
        default: {$ref: '#/components/responses/Error'}
  /history:
    get:
      operationId: listHistory
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {description: Events in server receipt order, content: {application/json: {schema: {$ref: '#/components/schemas/HistoryPage'}}}}
        default: {$ref: '#/components/responses/Error'}
  /authors:
    get:
      operationId: listAuthors
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: q, in: query, schema: {type: string}}
        - {name: following, in: query, schema: {type: boolean}}
      responses:
        '200': {description: Authors, content: {application/json: {schema: {$ref: '#/components/schemas/AuthorPage'}}}}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createAuthor
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AuthorCreate'}}}}
      responses:
        '201': {description: Author, content: {application/json: {schema: {$ref: '#/components/schemas/Author'}}}}
        default: {$ref: '#/components/responses/Error'}
  /authors/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      operationId: getAuthor
      responses:
        '200': {description: Author, content: {application/json: {schema: {$ref: '#/components/schemas/Author'}}}}
        default: {$ref: '#/components/responses/Error'}
    patch:
      operationId: updateAuthor
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AuthorUpdate'}}}}
      responses:
        '200': {description: Author, content: {application/json: {schema: {$ref: '#/components/schemas/Author'}}}}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteAuthor
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/ExpectedRevision'}]
      responses:
        '204': {description: Regular author removed; media and other authors remain}
        default: {$ref: '#/components/responses/Error'}
  /authors/merge:
    post:
      operationId: mergeAuthors
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AuthorMergeInput'}}}}
      responses:
        '200': {description: Explicit merge with target profile protection and archived source evidence, content: {application/json: {schema: {$ref: '#/components/schemas/AuthorMergeResult'}}}}
        default: {$ref: '#/components/responses/Error'}
  /collections:
    get:
      operationId: listCollections
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
        - {name: q, in: query, schema: {type: string}}
        - {name: libraryId, in: query, schema: {type: string}}
      responses:
        '200': {description: Collections, content: {application/json: {schema: {$ref: '#/components/schemas/CollectionPage'}}}}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createCollection
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CollectionCreate'}}}}
      responses:
        '201': {description: Collection, content: {application/json: {schema: {$ref: '#/components/schemas/Collection'}}}}
        default: {$ref: '#/components/responses/Error'}
  /uploads:
    post:
      operationId: createUpload
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UploadCreate'}}}}
      responses:
        '201': {description: Durable upload session, content: {application/json: {schema: {$ref: '#/components/schemas/Upload'}}}}
        default: {$ref: '#/components/responses/Error'}
  /uploads/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      operationId: getUpload
      responses:
        '200': {description: Authoritative offset and result, content: {application/json: {schema: {$ref: '#/components/schemas/Upload'}}}}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: cancelUpload
      responses:
        '204': {description: Incomplete upload cancelled; published assets are unaffected}
        default: {$ref: '#/components/responses/Error'}
  /uploads/{id}/content:
    parameters: [{$ref: '#/components/parameters/Id'}]
    put:
      operationId: appendUpload
      parameters: [{name: Upload-Offset, in: header, required: true, schema: {type: integer, format: int64, minimum: 0}}]
      requestBody: {required: true, content: {application/octet-stream: {schema: {type: string, format: binary}}}}
      responses:
        '200': {description: Saved offset; chunks are at most 8 MiB, content: {application/json: {schema: {$ref: '#/components/schemas/Upload'}}}}
        default: {$ref: '#/components/responses/Error'}
  /uploads/{id}/complete:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      operationId: completeUpload
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '200': {description: Ordinary upload is ingested; intelligent upload is staged, content: {application/json: {schema: {$ref: '#/components/schemas/UploadResult'}}}}
        default: {$ref: '#/components/responses/Error'}
  /batches:
    get:
      operationId: listBatches
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {description: Batches, content: {application/json: {schema: {$ref: '#/components/schemas/BatchPage'}}}}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createBatch
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/BatchCreate'}}}}
      responses:
        '201': {description: Accepted batch, content: {application/json: {schema: {$ref: '#/components/schemas/Batch'}}}}
        default: {$ref: '#/components/responses/Error'}
  /batches/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      operationId: getBatch
      responses:
        '200': {description: Durable item report, content: {application/json: {schema: {$ref: '#/components/schemas/BatchDetail'}}}}
        default: {$ref: '#/components/responses/Error'}
  /batches/{id}/cancel:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      operationId: cancelBatch
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RevisionRequest'}}}}
      responses:
        '200': {description: Cancelled future work; committed results remain, content: {application/json: {schema: {$ref: '#/components/schemas/Batch'}}}}
        default: {$ref: '#/components/responses/Error'}
  /ai/tasks/{id}/context:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      operationId: getTaskContext
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {description: Bounded context and next actions, content: {application/json: {schema: {$ref: '#/components/schemas/TaskContext'}}}}
        default: {$ref: '#/components/responses/Error'}
  /batches/{id}/research:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      operationId: submitResearch
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ResearchSubmit'}}}}
      responses:
        '200': {description: Candidate evidence saved without changing confirmed metadata, content: {application/json: {schema: {$ref: '#/components/schemas/Batch'}}}}
        default: {$ref: '#/components/responses/Error'}
  /batches/{id}/plans:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      operationId: preparePlan
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PlanCreate'}}}}
      responses:
        '201': {description: Complete immutable naming plan, content: {application/json: {schema: {$ref: '#/components/schemas/Plan'}}}}
        default: {$ref: '#/components/responses/Error'}
  /batches/{id}/plans/{planId}:
    parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/PlanId'}]
    get:
      operationId: getPlan
      responses:
        '200': {description: Full persisted plan, content: {application/json: {schema: {$ref: '#/components/schemas/Plan'}}}}
        default: {$ref: '#/components/responses/Error'}
  /batches/{id}/plans/{planId}/commit:
    parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/PlanId'}]
    post:
      operationId: commitPlan
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [fingerprint], properties: {fingerprint: {type: string}}}}}} 
      responses:
        '200': {description: Per-item authoritative results; inspect failures, content: {application/json: {schema: {$ref: '#/components/schemas/BatchDetail'}}}}
        default: {$ref: '#/components/responses/Error'}
  /trash:
    get:
      operationId: listTrash
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {description: Recoverable assets, content: {application/json: {schema: {$ref: '#/components/schemas/AssetPage'}}}}
        default: {$ref: '#/components/responses/Error'}
  /trash/{id}/restore:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      operationId: restoreAsset
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RevisionRequest'}}}}
      responses:
        '200': {description: Restored original identity and relationships, content: {application/json: {schema: {$ref: '#/components/schemas/Asset'}}}}
        default: {$ref: '#/components/responses/Error'}
  /trash/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    delete:
      operationId: purgeAsset
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {name: expectedRevision, in: query, required: true, schema: {type: integer, format: int64}}
      responses:
        '204': {description: Explicit permanent removal; historical events remain}
        default: {$ref: '#/components/responses/Error'}
  /stats:
    get:
      operationId: getStats
      responses:
        '200': {description: Exact counts; no replacement recommendation formula, content: {application/json: {schema: {$ref: '#/components/schemas/Stats'}}}}
        default: {$ref: '#/components/responses/Error'}
  /settings:
    get:
      operationId: getSettings
      responses:
        '200': {description: Server-owned operational limits, content: {application/json: {schema: {$ref: '#/components/schemas/Settings'}}}}
        default: {$ref: '#/components/responses/Error'}
  /operations/{key}:
    get:
      operationId: getOperation
      parameters:
        - {name: key, in: path, required: true, schema: {type: string, minLength: 8, maxLength: 128}}
        - {name: operation, in: query, schema: {type: string}, description: Exact operation identity returned by a prior receipt; required if the key names multiple operations}
      responses:
        '200': {description: Caller-owned durable receipt, content: {application/json: {schema: {$ref: '#/components/schemas/OperationReceipt'}}}}
        default: {$ref: '#/components/responses/Error'}
  /backups:
    post:
      operationId: createBackupManifest
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '201': {description: Consistent database snapshot and original-version manifest; not proof of independent backup, content: {application/json: {schema: {$ref: '#/components/schemas/Backup'}}}}
        default: {$ref: '#/components/responses/Error'}
  /recommendations:
    get:
      operationId: getRecommendations
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
        - {name: seed, in: query, schema: {type: integer, format: int64, default: 0}}
        - {name: kind, in: query, schema: {type: string, enum: [regular, cos]}}
        - {name: mediaType, in: query, schema: {type: string, enum: [image, animated_image, video]}}
      responses:
        '200': {description: Deterministic personalized page, content: {application/json: {schema: {$ref: '#/components/schemas/RecommendationPage'}}}}
        default: {$ref: '#/components/responses/Error'}
  /author-tasks:
    post:
      operationId: createAuthorTask
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AuthorTaskCreate'}}}}
      responses:
        '201': {description: Trusted author maintenance authorization, content: {application/json: {schema: {$ref: '#/components/schemas/AuthorTask'}}}}
        default: {$ref: '#/components/responses/Error'}
  /author-tasks/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      operationId: getAuthorTask
      responses:
        '200': {description: Maintenance task and current author, content: {application/json: {schema: {$ref: '#/components/schemas/AuthorTaskContext'}}}}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: cancelAuthorTask
      responses:
        '204': {description: Authorization revoked}
        default: {$ref: '#/components/responses/Error'}
  /rankings:
    get:
      operationId: getRankings
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
        - {name: period, in: query, schema: {type: string, enum: [day, week, month, quarter, year, all], default: week}}
        - {name: kind, in: query, schema: {type: string, enum: [regular, cos]}}
        - {name: mediaType, in: query, schema: {type: string, enum: [image, animated_image, video]}}
      responses:
        '200': {description: Activity ranking, content: {application/json: {schema: {$ref: '#/components/schemas/RankingPage'}}}}
        default: {$ref: '#/components/responses/Error'}
  /preferences/recommendation:
    get:
      operationId: getRecommendationPreferences
      responses:
        '200': {description: Current weights and presets, content: {application/json: {schema: {$ref: '#/components/schemas/RecommendationPreferences'}}}}
        default: {$ref: '#/components/responses/Error'}
    put:
      operationId: updateRecommendationPreferences
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RecommendationPreferencesUpdate'}}}}
      responses:
        '200': {description: Saved preference revision, content: {application/json: {schema: {$ref: '#/components/schemas/RecommendationPreferences'}}}}
        default: {$ref: '#/components/responses/Error'}
  /stats/overview:
    get:
      operationId: getStatsOverview
      parameters: [{$ref: '#/components/parameters/StatsRange'}]
      responses:
        '200': {description: Inventory and activity are separate dimensions, content: {application/json: {schema: {$ref: '#/components/schemas/StatsOverview'}}}}
        default: {$ref: '#/components/responses/Error'}
  /stats/trends:
    get:
      operationId: getStatsTrends
      parameters: [{$ref: '#/components/parameters/StatsRange'}]
      responses:
        '200': {description: Calendar buckets, content: {application/json: {schema: {$ref: '#/components/schemas/StatsTrends'}}}}
        default: {$ref: '#/components/responses/Error'}
  /stats/review:
    get:
      operationId: getBrowsingReview
      parameters: [{$ref: '#/components/parameters/StatsRange'}]
      responses:
        '200': {description: Browsing review and previous-window comparison, content: {application/json: {schema: {$ref: '#/components/schemas/BrowsingReview'}}}}
        default: {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
    sessionCookie: {type: apiKey, in: cookie, name: qimeng_session}
  parameters:
    ExpectedRevision: {name: expectedRevision, in: query, required: true, schema: {type: integer, format: int64, minimum: 1}}
    StatsRange: {name: range, in: query, schema: {type: string, enum: [7d, day, 30d, 90d, week, month, quarter, year, all], default: 7d}}
    Id: {name: id, in: path, required: true, schema: {type: string}}
    PlanId: {name: planId, in: path, required: true, schema: {type: string}}
    Cursor: {name: cursor, in: query, schema: {type: string}}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 128}}
  responses:
    Error:
      description: Explicit failure. 409 means re-read current state; retry unchanged idempotent operations with the same key.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  schemas:
    AuthorTaskCreate:
      type: object
      required: [authorId, expectedRevision, allowedFields, allowClear]
      properties:
        authorId: {type: string}
        expectedRevision: {type: integer, format: int64}
        allowedFields: {type: array, minItems: 1, maxItems: 4, uniqueItems: true, items: {type: string, enum: [name, biography, homepage, aliases]}}
        allowClear: {type: boolean}
        maxUpdates: {type: integer, minimum: 1, maximum: 10, default: 1}
        expiresInSeconds: {type: integer, minimum: 60, maximum: 86400, default: 3600}
    AuthorTask:
      type: object
      required: [id, authorId, expectedRevision, allowedFields, allowClear, maxUpdates, usedUpdates, state, expiresAt, createdAt]
      properties:
        id: {type: string}
        authorId: {type: string}
        expectedRevision: {type: integer, format: int64}
        allowedFields: {type: array, items: {type: string}}
        allowClear: {type: boolean}
        maxUpdates: {type: integer}
        usedUpdates: {type: integer}
        state: {type: string, enum: [authorized, completed, cancelled]}
        expiresAt: {type: string, format: date-time}
        createdAt: {type: string, format: date-time}
    AuthorTaskContext:
      type: object
      required: [task, author, nextActions]
      properties:
        task: {$ref: '#/components/schemas/AuthorTask'}
        author: {$ref: '#/components/schemas/Author'}
        nextActions: {type: array, items: {type: string}}
    RecommendationWeights:
      type: object
      required: [tagRelevance, tagCollection, engagement, recency, likeScore, discovery, freshness, browseDepth, maxRandom]
      properties:
        tagRelevance: {type: number, format: double, minimum: 0, maximum: 1}
        tagCollection: {type: number, format: double, minimum: 0, maximum: 1}
        engagement: {type: number, format: double, minimum: 0, maximum: 1}
        recency: {type: number, format: double, minimum: 0, maximum: 1}
        likeScore: {type: number, format: double, minimum: 0, maximum: 1}
        discovery: {type: number, format: double, minimum: 0, maximum: 1}
        freshness: {type: number, format: double, minimum: 0, maximum: 1}
        browseDepth: {type: number, format: double, minimum: 0, maximum: 1}
        maxRandom: {type: number, format: double, minimum: 0, maximum: 1}
    RecommendationPreferences:
      type: object
      required: [revision, weights, presets]
      properties:
        revision: {type: integer, format: int64}
        weights: {$ref: '#/components/schemas/RecommendationWeights'}
        presets: {type: object, additionalProperties: {$ref: '#/components/schemas/RecommendationWeights'}}
    RecommendationPreferencesUpdate:
      type: object
      required: [expectedRevision, weights]
      properties: {expectedRevision: {type: integer, format: int64}, weights: {$ref: '#/components/schemas/RecommendationWeights'}}
    RecommendationPage:
      type: object
      required: [items, snapshotId]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Asset'}}
        nextCursor: {type: string}
        snapshotId: {type: string}
    RankedAsset:
      type: object
      required: [asset, score]
      properties: {asset: {$ref: '#/components/schemas/Asset'}, score: {type: integer, format: int64}}
    RankingPage:
      type: object
      required: [items]
      properties: {items: {type: array, items: {$ref: '#/components/schemas/RankedAsset'}}, nextCursor: {type: string}}
    ActivityTotals:
      type: object
      required: [views, plays, seconds]
      properties:
        views: {type: integer, format: int64}
        plays: {type: integer, format: int64}
        seconds: {type: integer, format: int64}
    ActivityDimension:
      type: object
      required: [key, views, plays, seconds, assets, bytes]
      properties:
        key: {type: string}
        views: {type: integer, format: int64}
        plays: {type: integer, format: int64}
        seconds: {type: integer, format: int64}
        assets: {type: integer, format: int64}
        bytes: {type: integer, format: int64}
    StatsOverview:
      type: object
      required: [range, inventory, totals, activeDays, viewedAssets, viewedAuthors, viewedTags, averageViewsPerFile, mediaTypes, sources]
      properties:
        range: {type: string}
        inventory: {$ref: '#/components/schemas/Stats'}
        totals: {$ref: '#/components/schemas/ActivityTotals'}
        activeDays: {type: integer}
        viewedAssets: {type: integer}
        viewedAuthors: {type: integer}
        viewedTags: {type: integer}
        averageViewsPerFile: {type: number, format: double, nullable: true}
        mediaTypes: {type: array, items: {$ref: '#/components/schemas/ActivityDimension'}}
        sources: {type: array, items: {$ref: '#/components/schemas/ActivityDimension'}}
    TrendBucket:
      type: object
      required: [start, end, label, views, plays, seconds]
      properties:
        start: {type: string, format: date-time}
        end: {type: string, format: date-time}
        label: {type: string}
        views: {type: integer, format: int64}
        plays: {type: integer, format: int64}
        seconds: {type: integer, format: int64}
    StatsTrends:
      type: object
      required: [range, granularity, items]
      properties:
        range: {type: string}
        granularity: {type: string, enum: [day, week, month, quarter, year]}
        items: {type: array, items: {$ref: '#/components/schemas/TrendBucket'}}
    ReviewHour:
      type: object
      required: [hour, views, seconds, imageSeconds, animatedSeconds, videoSeconds]
      properties:
        hour: {type: integer}
        views: {type: integer, format: int64}
        seconds: {type: integer, format: int64}
        imageSeconds: {type: integer, format: int64}
        animatedSeconds: {type: integer, format: int64}
        videoSeconds: {type: integer, format: int64}
    InterestChange:
      type: object
      required: [kind, id, name, currentShare, previousShare, changePoints, currentViews, previousViews]
      properties:
        kind: {type: string, enum: [author, tag]}
        id: {type: string}
        name: {type: string}
        currentShare: {type: number, format: double, description: 'Percentage 0–100; multiple associations are not mutually exclusive'}
        previousShare: {type: number, format: double, description: 'Percentage 0–100; multiple associations are not mutually exclusive'}
        changePoints: {type: number, format: double}
        currentViews: {type: integer, format: int64}
        previousViews: {type: integer, format: int64}
    BrowsingReview:
      type: object
      required: [range, firstViews, returnViews, distinctAssets, activeDays, totalSeconds, comparisonAvailable, hours, changes]
      properties:
        range: {type: string}
        firstViews: {type: integer, format: int64}
        returnViews: {type: integer, format: int64}
        distinctAssets: {type: integer}
        activeDays: {type: integer}
        comparisonAvailable: {type: boolean}
        totalSeconds: {type: integer, format: int64}
        hours: {type: array, minItems: 24, maxItems: 24, items: {$ref: '#/components/schemas/ReviewHour'}}
        changes: {type: array, maxItems: 6, items: {$ref: '#/components/schemas/InterestChange'}}
    Error:
      type: object
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
        currentRevision: {type: integer, format: int64}
    Instance:
      type: object
      required: [id, name, apiVersion, capabilities]
      properties:
        id: {type: string}
        name: {type: string}
        apiVersion: {type: string}
        capabilities:
          type: object
          required: [aiConfigured, recommendations, rankings, stats, backups, migration]
          properties:
            aiConfigured: {type: boolean}
            recommendations: {type: boolean}
            rankings: {type: boolean}
            stats: {type: boolean}
            backups: {type: boolean}
            migration: {type: boolean}
    SessionCreate:
      type: object
      required: [token, label]
      properties: {token: {type: string}, label: {type: string, maxLength: 80}}
    CredentialCreate:
      type: object
      required: [label, scopes]
      properties:
        label: {type: string, maxLength: 80}
        batchId: {type: string}
        authorTaskId: {type: string, description: 'Exactly one of batchId and authorTaskId is required'}
        scopes: {type: array, items: {type: string, enum: [read, ingest, research, organize, author.profile.write]}}
    Session:
      type: object
      required: [id, label, scopes, expiresAt]
      properties:
        id: {type: string}
        token: {type: string, description: Only returned on creation}
        label: {type: string}
        scopes: {type: array, items: {type: string}}
        batchId: {type: string}
        authorTaskId: {type: string}
        expiresAt: {type: string, format: date-time}
    LibraryCreate:
      type: object
      required: [name, kind]
      properties: {name: {type: string, minLength: 1, maxLength: 120}, kind: {type: string, enum: [regular, cos]}}
    Library:
      allOf:
        - {$ref: '#/components/schemas/LibraryCreate'}
        - {type: object, required: [id, enabled, revision, createdAt], properties: {id: {type: string}, enabled: {type: boolean}, revision: {type: integer, format: int64}, createdAt: {type: string, format: date-time}}}
    LibraryUpdate:
      type: object
      required: [expectedRevision]
      properties: {expectedRevision: {type: integer, format: int64}, name: {type: string, maxLength: 120}, enabled: {type: boolean}}
    Asset:
      type: object
      required: [id, libraryId, fileName, originalFileName, relativePath, mediaType, mimeType, size, hash, revision, tagsRevision, contentVersion, authorId, authorIds, authorsRevision, authorStatus, tags, favorite, liked, likeCount, note, createdAt, updatedAt, contentUrl, probeState, trashed, positionMs, positionContentVersion]
      properties:
        id: {type: string}
        libraryId: {type: string}
        fileName: {type: string}
        originalFileName: {type: string}
        relativePath: {type: string}
        mediaType: {type: string, enum: [image, animated_image, video]}
        mimeType: {type: string}
        size: {type: integer, format: int64}
        hash: {type: string}
        revision: {type: integer, format: int64}
        tagsRevision: {type: integer, format: int64}
        contentVersion: {type: integer, format: int64}
        authorId: {type: string}
        authorName: {type: string}
        authorIds: {type: array, items: {type: string}, description: Complete atomic relationship set; known authors automatically remove the unknown placeholder}
        authorsRevision: {type: integer, format: int64}
        authorStatus: {type: string, enum: [unknown, confirmed]}
        collectionId: {type: string}
        page: {type: integer}
        tags: {type: array, items: {type: string}}
        favorite: {type: boolean}
        liked: {type: boolean}
        likeCount: {type: integer, format: int64, description: Lifetime daily likes; liked means liked today in the configured server timezone}
        note: {type: string}
        source: {type: string}
        sourceIds: {type: array, items: {type: string}}
        acquisitionSources: {type: array, items: {type: string}, description: User-provided acquisition channels; separate from the source work identity}
        characters: {type: array, items: {type: string}}
        characterIds: {type: array, items: {type: string}}
        metadataSource: {type: string, enum: [upload, human, ai]}
        sourceMtime: {type: string, format: date-time}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        contentUrl: {type: string}
        thumbnailUrl: {type: string}
        width: {type: integer}
        height: {type: integer}
        durationMs: {type: integer, format: int64}
        probeState: {type: string, enum: [ready, unavailable, failed]}
        trashed: {type: boolean}
        positionMs: {type: integer, format: int64}
        positionContentVersion: {type: integer, format: int64}
    RevisionRequest:
      type: object
      required: [expectedRevision]
      properties: {expectedRevision: {type: integer, format: int64, minimum: 1}}
    AssetUpdate:
      type: object
      required: [expectedRevision]
      properties:
        expectedRevision: {type: integer, format: int64}
        authorId: {type: string}
        authorIds: {type: array, maxItems: 20, items: {type: string}}
        expectedAuthorsRevision: {type: integer, format: int64}
        note: {type: string, maxLength: 10000}
        source: {type: string, maxLength: 200}
        sourceIds: {type: array, maxItems: 20, items: {type: string}}
        acquisitionSources: {type: array, maxItems: 100, items: {type: string, maxLength: 2000}}
        characterIds: {type: array, maxItems: 50, items: {type: string}}
        characters: {type: array, maxItems: 50, items: {type: string, maxLength: 200}}
    TagsUpdate:
      type: object
      required: [expectedRevision, tags]
      properties:
        expectedRevision: {type: integer, format: int64, description: 'Compare Asset.tagsRevision, not the overall revision'}
        tags: {type: array, maxItems: 100, items: {type: string, minLength: 1, maxLength: 100}}
    ReactionUpdate:
      type: object
      required: [favorite, liked]
      properties: {favorite: {type: boolean}, liked: {type: boolean, description: True requests one daily like. False does not add a like and never undoes accumulated likes.}}
    EventCreate:
      type: object
      required: [eventId, kind, contentVersion]
      properties:
        eventId: {type: string, minLength: 8, maxLength: 128}
        kind: {type: string, enum: [view, play, progress, dwell]}
        sessionId: {type: string, maxLength: 128}
        seconds: {type: number, format: double, minimum: 0, maximum: 86400, description: 'Dwell duration; floor to whole seconds, values below one second are rejected for dwell'}
        occurredAt: {type: string, format: date-time, description: 'UTC start of the visible segment; server receipt time if omitted'}
        contentVersion: {type: integer, format: int64}
        positionMs: {type: integer, format: int64, minimum: 0}
    HistoryEvent:
      allOf:
        - {$ref: '#/components/schemas/EventCreate'}
        - {type: object, required: [assetId, createdAt], properties: {assetId: {type: string}, fileName: {type: string}, createdAt: {type: string, format: date-time}}}
    MoveRequest:
      type: object
      required: [expectedRevision, relativePath]
      properties: {expectedRevision: {type: integer, format: int64}, relativePath: {type: string, maxLength: 500}}
    AuthorCreate:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        kind: {type: string, enum: [regular, cos], default: regular}
        biography: {type: string, maxLength: 20000}
        aliases: {type: array, maxItems: 100, items: {type: string}}
        homepage: {type: string, maxLength: 2000}
        batchId: {type: string}
    Author:
      allOf:
        - {$ref: '#/components/schemas/AuthorCreate'}
        - type: object
          required: [id, revision, placeholder, following, fieldStatus, createdAt, updatedAt]
          properties:
            id: {type: string}
            revision: {type: integer, format: int64}
            placeholder: {type: boolean}
            following: {type: boolean}
            fieldStatus: {type: object, additionalProperties: {type: string, enum: [missing, candidate, confirmed]}}
            createdAt: {type: string, format: date-time}
            updatedAt: {type: string, format: date-time}
    AuthorUpdate:
      type: object
      required: [expectedRevision]
      properties:
        expectedRevision: {type: integer, format: int64}
        name: {type: string, maxLength: 200}
        biography: {type: string, maxLength: 20000}
        homepage: {type: string, maxLength: 2000}
        aliases: {type: array, maxItems: 100, items: {type: string}}
        following: {type: boolean}
    AuthorMergeInput:
      type: object
      required: [sourceId, targetId, expectedSourceRevision, expectedTargetRevision]
      properties: {sourceId: {type: string}, targetId: {type: string}, expectedSourceRevision: {type: integer, format: int64}, expectedTargetRevision: {type: integer, format: int64}}
    AuthorMergeResult:
      type: object
      required: [author, affectedAssets, preservedConflicts]
      properties: {author: {$ref: '#/components/schemas/Author'}, affectedAssets: {type: integer}, preservedConflicts: {type: array, items: {type: string}}}
    CollectionCreate:
      type: object
      required: [libraryId, name, kind]
      properties:
        libraryId: {type: string}
        name: {type: string, minLength: 1, maxLength: 200}
        kind: {type: string, enum: [image_set, short_drama]}
        aliases: {type: array, maxItems: 100, items: {type: string}}
    Collection:
      allOf:
        - {$ref: '#/components/schemas/CollectionCreate'}
        - {type: object, required: [id, revision, createdAt], properties: {id: {type: string}, revision: {type: integer, format: int64}, createdAt: {type: string, format: date-time}}}
    UploadCreate:
      type: object
      required: [libraryId, fileName, size, mimeType, mode]
      properties:
        libraryId: {type: string}
        fileName: {type: string, minLength: 1, maxLength: 240}
        size: {type: integer, format: int64, minimum: 1}
        mimeType: {type: string}
        expectedHash: {type: string, pattern: '^[0-9a-fA-F]{64}$', description: Optional complete source SHA-256 snapshot. When provided the server must match it before staging or publishing.}
        mode: {type: string, enum: [ordinary, intelligent]}
        batchId: {type: string}
        sourceMtime: {type: string, format: date-time}
        relativeDirectory: {type: string, maxLength: 500}
        authorId: {type: string}
        authorIds: {type: array, maxItems: 20, items: {type: string}}
        collectionId: {type: string}
        note: {type: string, maxLength: 10000}
        acquisitionSources: {type: array, maxItems: 100, items: {type: string, maxLength: 2000}}
        sourceIds: {type: array, maxItems: 20, items: {type: string}}
        characterIds: {type: array, maxItems: 50, items: {type: string}}
        family: {type: string, maxLength: 200, description: Optional automatic work numbering requested by the user}
        replaceAssetId: {type: string, description: Admin device only; explicit replacement intent}
        expectedContentVersion: {type: integer, format: int64}
    Upload:
      allOf:
        - {$ref: '#/components/schemas/UploadCreate'}
        - type: object
          required: [id, offset, state, createdAt]
          properties:
            id: {type: string}
            offset: {type: integer, format: int64}
            state: {type: string, enum: [receiving, staged, ingested, duplicate, cancelled, failed]}
            assetId: {type: string}
            hash: {type: string}
            errorCode: {type: string}
            errorMessage: {type: string}
            createdAt: {type: string, format: date-time}
    UploadResult:
      type: object
      required: [upload]
      properties: {upload: {$ref: '#/components/schemas/Upload'}, asset: {$ref: '#/components/schemas/Asset'}}
    BatchCreate:
      type: object
      required: [libraryId, mode, label]
      properties:
        libraryId: {type: string}
        mode: {type: string, enum: [ordinary, intelligent]}
        label: {type: string, maxLength: 200}
        maxResearchCalls: {type: integer, minimum: 0, maximum: 100, default: 8}
    Batch:
      allOf:
        - {$ref: '#/components/schemas/BatchCreate'}
        - type: object
          required: [id, state, revision, researchCalls, backupState, cleanupState, createdAt, updatedAt]
          properties:
            id: {type: string}
            state: {type: string, enum: [receiving, waiting_executor, ready, partial, completed, cancelled]}
            revision: {type: integer, format: int64}
            researchCalls: {type: integer}
            backupState: {type: string, enum: [not_covered, awaiting_external_backup]}
            cleanupState: {type: string, enum: [retained]}
            createdAt: {type: string, format: date-time}
            updatedAt: {type: string, format: date-time}
    BatchItem:
      type: object
      required: [upload, researchOutcome, candidates]
      properties:
        upload: {$ref: '#/components/schemas/Upload'}
        researchOutcome: {type: string}
        candidates: {type: array, items: {$ref: '#/components/schemas/ResearchCandidate'}}
    BatchDetail:
      type: object
      required: [batch, items, plans]
      properties:
        batch: {$ref: '#/components/schemas/Batch'}
        items: {type: array, items: {$ref: '#/components/schemas/BatchItem'}}
        plans: {type: array, items: {$ref: '#/components/schemas/PlanSummary'}}
    ResearchCandidate:
      type: object
      required: [sourceUrl, evidence]
      properties:
        authorId: {type: string}
        name: {type: string, maxLength: 200}
        sourceUrl: {type: string, maxLength: 2000}
        evidence: {type: string, maxLength: 4000}
    ResearchSubmit:
      type: object
      required: [expectedRevision, uploadId, expectedHash, outcome, candidates, callsUsed]
      properties:
        expectedRevision: {type: integer, format: int64}
        uploadId: {type: string}
        expectedHash: {type: string}
        outcome: {type: string, enum: [candidates, unknown, conflict]}
        candidates: {type: array, maxItems: 20, items: {$ref: '#/components/schemas/ResearchCandidate'}}
        callsUsed: {type: integer, minimum: 1, maximum: 100}
    PlanInput:
      type: object
      required: [uploadId, family]
      properties:
        uploadId: {type: string}
        family: {type: string, minLength: 1, maxLength: 200}
        authorId: {type: string}
        authorIds: {type: array, maxItems: 20, items: {type: string}}
        sourceIds: {type: array, maxItems: 20, items: {type: string}}
        characterIds: {type: array, maxItems: 50, items: {type: string}}
        groupKey: {type: string, maxLength: 100}
        collectionId: {type: string}
        page: {type: integer, minimum: 1}
    PlanCreate:
      type: object
      required: [expectedRevision, items]
      properties:
        expectedRevision: {type: integer, format: int64}
        items: {type: array, minItems: 1, maxItems: 100, items: {$ref: '#/components/schemas/PlanInput'}}
    PlanItem:
      type: object
      required: [uploadId, fileName, relativePath, authorId, authorIds, expectedHash]
      properties:
        uploadId: {type: string}
        fileName: {type: string}
        relativePath: {type: string}
        authorId: {type: string}
        authorIds: {type: array, items: {type: string}}
        sourceIds: {type: array, items: {type: string}}
        characterIds: {type: array, items: {type: string}}
        collectionId: {type: string}
        page: {type: integer}
        expectedHash: {type: string}
    PlanSummary:
      type: object
      required: [id, state, fingerprint]
      properties: {id: {type: string}, state: {type: string}, fingerprint: {type: string}}
    Plan:
      allOf:
        - {$ref: '#/components/schemas/PlanSummary'}
        - type: object
          required: [batchId, batchRevision, directoryFingerprint, items]
          properties:
            batchId: {type: string}
            batchRevision: {type: integer, format: int64}
            directoryFingerprint: {type: string}
            items: {type: array, items: {$ref: '#/components/schemas/PlanItem'}}
    TaskContext:
      type: object
      required: [batch, policyVersion, nextActions, remainingResearchCalls, items, limitations]
      properties:
        batch: {$ref: '#/components/schemas/Batch'}
        policyVersion: {type: string}
        nextActions: {type: array, items: {type: string}}
        remainingResearchCalls: {type: integer}
        items: {type: array, items: {$ref: '#/components/schemas/BatchItem'}}
        nextCursor: {type: string}
        limitations: {type: array, items: {type: string}}
    Stats:
      type: object
      required: [assets, images, videos, bytes, favorites, authors, events, trash]
      properties:
        assets: {type: integer, format: int64}
        images: {type: integer, format: int64}
        videos: {type: integer, format: int64}
        bytes: {type: integer, format: int64}
        favorites: {type: integer, format: int64}
        authors: {type: integer, format: int64}
        events: {type: integer, format: int64}
        trash: {type: integer, format: int64}
    Settings:
      type: object
      required: [maxChunkBytes, maxActiveUploads, maxBatchItems, sourceCleanupEnabled]
      properties:
        maxChunkBytes: {type: integer, format: int64}
        maxActiveUploads: {type: integer}
        maxBatchItems: {type: integer}
        sourceCleanupEnabled: {type: boolean}
    Directory:
      type: object
      required: [relativePath, name]
      properties: {relativePath: {type: string}, name: {type: string}}
    DirectoryPage:
      type: object
      required: [items]
      properties: {items: {type: array, items: {$ref: '#/components/schemas/Directory'}}, nextCursor: {type: string}}
    Tag:
      type: object
      required: [name, revision, createdAt, updatedAt]
      properties: {name: {type: string}, revision: {type: integer, format: int64}, createdAt: {type: string}, updatedAt: {type: string}}
    TagPage:
      type: object
      required: [items]
      properties: {items: {type: array, items: {$ref: '#/components/schemas/Tag'}}, nextCursor: {type: string}}
    TimelineInput:
      type: object
      required: [positionMs, label, contentVersion]
      properties:
        positionMs: {type: integer, format: int64, minimum: 0}
        label: {type: string, minLength: 1, maxLength: 200}
        color: {type: string, pattern: '^#[0-9a-fA-F]{6}$'}
        contentVersion: {type: integer, format: int64}
        expectedRevision: {type: integer, format: int64, description: Required when updating an existing mark}
    TimelineMark:
      allOf:
        - {$ref: '#/components/schemas/TimelineInput'}
        - {type: object, required: [id, assetId, revision, createdAt, updatedAt], properties: {id: {type: string}, assetId: {type: string}, revision: {type: integer, format: int64}, createdAt: {type: string, format: date-time}, updatedAt: {type: string, format: date-time}}}
    TimelinePage:
      type: object
      required: [items]
      properties: {items: {type: array, items: {$ref: '#/components/schemas/TimelineMark'}}, nextCursor: {type: string}}
    TermInput:
      type: object
      required: [name, aliases]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        aliases: {type: array, maxItems: 100, items: {type: string}}
        sourceId: {type: string, description: Required for characters}
        expectedRevision: {type: integer, format: int64, description: Required for updates}
    Source:
      type: object
      required: [id, name, aliases, revision, createdAt, updatedAt]
      properties: {id: {type: string}, name: {type: string}, aliases: {type: array, items: {type: string}}, revision: {type: integer, format: int64}, createdAt: {type: string, format: date-time}, updatedAt: {type: string, format: date-time}}
    Character:
      allOf:
        - {$ref: '#/components/schemas/Source'}
        - {type: object, required: [sourceId], properties: {sourceId: {type: string}}}
    SourcePage:
      type: object
      required: [items]
      properties: {items: {type: array, items: {$ref: '#/components/schemas/Source'}}, nextCursor: {type: string}}
    CharacterPage:
      type: object
      required: [items]
      properties: {items: {type: array, items: {$ref: '#/components/schemas/Character'}}, nextCursor: {type: string}}
    OperationReceipt:
      type: object
      required: [state, idempotencyKey]
      properties:
        state: {type: string, enum: [not_recorded, committed]}
        idempotencyKey: {type: string}
        operation: {type: string}
        status: {type: integer}
        response: {type: object, additionalProperties: true, description: Original bounded response. A missing receipt is not proof that no file intent exists; reissue the identical operation.}
    Backup:
      type: object
      required: [id, state, createdAt, snapshotHash, assetCount, manifestHash]
      properties:
        id: {type: string}
        state: {type: string, enum: [awaiting_external_backup]}
        createdAt: {type: string, format: date-time}
        snapshotHash: {type: string}
        assetCount: {type: integer}
        manifestHash: {type: string}
    AssetPage:
      type: object
      required: [items]
      properties: {items: {type: array, items: {$ref: '#/components/schemas/Asset'}}, nextCursor: {type: string}}
    LibraryPage:
      type: object
      required: [items]
      properties: {items: {type: array, items: {$ref: '#/components/schemas/Library'}}, nextCursor: {type: string}}
    AuthorPage:
      type: object
      required: [items]
      properties: {items: {type: array, items: {$ref: '#/components/schemas/Author'}}, nextCursor: {type: string}}
    CollectionPage:
      type: object
      required: [items]
      properties: {items: {type: array, items: {$ref: '#/components/schemas/Collection'}}, nextCursor: {type: string}}
    HistoryPage:
      type: object
      required: [items]
      properties: {items: {type: array, items: {$ref: '#/components/schemas/HistoryEvent'}}, nextCursor: {type: string}}
    BatchPage:
      type: object
      required: [items]
      properties: {items: {type: array, items: {$ref: '#/components/schemas/Batch'}}, nextCursor: {type: string}}
