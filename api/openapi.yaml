      properties:
        id: {type: string}
        libraryId: {type: string}
        state: {type: string, enum: [queued, running, completed, partial, failed, interrupted, cancelled]}
        processed: {type: integer}
        added: {type: integer}
        moved: {type: integer}
        changed: {type: integer}
        skipped: {type: integer}
        missing: {type: integer}
        issueCount: {type: integer}
        issues: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/ScanIssue'}}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    Storage:
      type: object
      required: [id, available]
      properties: {id: {type: string}, available: {type: boolean}}
    StoragePage:
      type: object
      required: [items]
      properties: {items: {type: array, items: {$ref: '#/components/schemas/Storage'}}}
    LibraryUpdate:
      type: object
      required: [expectedRevision]
      properties: {expectedRevision: {type: integer, format: int64}, name: {type: string, maxLength: 120}, enabled: {type: boolean}}
    Asset:
      type: object
      required: [id, libraryId, fileName, originalFileName, relativePath, mediaType, mimeType, size, hash, revision, tagsRevision, contentVersion, authorId, authorIds, authorsRevision, authorStatus, tags, favorite, liked, likeCount, note, createdAt, updatedAt, contentUrl, probeState, trashed, positionMs, positionContentVersion]
      properties:
        id: {type: string}
        libraryId: {type: string}
        fileName: {type: string}
        originalFileName: {type: string}
        sourceRelativePath: {type: string, description: Original relative source clue; never a host absolute path}
        relativePath: {type: string}
        mediaType: {type: string, enum: [image, animated_image, video]}
        mimeType: {type: string}
        size: {type: integer, format: int64}
        hash: {type: string}
        revision: {type: integer, format: int64}
        tagsRevision: {type: integer, format: int64}
        tagSetUpdatedAt: {type: string, format: date-time, description: 'Time of an explicit tag-set change; absent means unknown or never explicitly set, not the asset update time'}
        tagSetSource: {type: string, description: Provenance of the authoritative whole tag set}
        favoriteUpdatedAt: {type: string, format: date-time, description: Last explicit favorite-state change; absent means no known local decision}
        favoritedAt: {type: string, format: date-time, description: Known time of the current favorite; repeated true preserves this time and a new false-to-true transition replaces it}
        cosWorkId: {type: string}
        cosDirectoryAuthorId: {type: string, description: Directory-derived author relationship maintained during COS path moves}
        contentVersion: {type: integer, format: int64}
        authorId: {type: string}
        authorName: {type: string}
        authorIds: {type: array, items: {type: string}, description: Complete atomic relationship set; known authors automatically remove the unknown placeholder}
        authorsRevision: {type: integer, format: int64}
        authorStatus: {type: string, enum: [unknown, confirmed]}
        collectionId: {type: string}
        page: {type: integer}
        tags: {type: array, items: {type: string}}
        favorite: {type: boolean}
        liked: {type: boolean}
        likeCount: {type: integer, format: int64, description: Lifetime likes including preserved legacy aggregate; liked means a known vote today in the configured server timezone}
        unattributedLikeCount: {type: integer, format: int64, minimum: 0, description: Preserved legacy votes whose individual days are unknown; included in likeCount but excluded from dated windows}
        viewCount: {type: integer, format: int64, minimum: 0, description: Lifetime views from server daily aggregates}
        playCount: {type: integer, format: int64, minimum: 0, description: Lifetime plays from server daily aggregates}
        cosWorkName: {type: string, description: Current registered COS work title; never inferred by the client from a path}
        workKeys: {type: array, items: {type: string}, description: Current opaque work-dimension membership on list/detail reads}
        roleKeys: {type: array, items: {type: string}, description: Current opaque role-dimension membership on list/detail reads}
        workFacets: {type: array, items: {$ref: '#/components/schemas/AssetFacetReference'}}
        roleFacets: {type: array, items: {$ref: '#/components/schemas/AssetFacetReference'}}
        note: {type: string}
        source: {type: string}
        sourceIds: {type: array, items: {type: string}}
        acquisitionSources: {type: array, items: {type: string}, description: User-provided acquisition channels; separate from the source work identity}
        characters: {type: array, items: {type: string}}
        characterIds: {type: array, items: {type: string}}
        metadataSource: {type: string, enum: [upload, human, ai, scanner, migration]}
        contentMtime: {type: string, format: date-time}
        fileDate: {type: string, format: date-time, nullable: true, description: 'Authoritative current-file date for sorting and grouping; verified contentMtime first and sourceMtime only when unavailable. Never falls back to added time.'}
        sourceMtime: {type: string, format: date-time}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        contentUrl: {type: string}
        thumbnailUrl: {type: string}
        width: {type: integer}
        height: {type: integer}
        durationMs: {type: integer, format: int64}
        probeState: {type: string, enum: [ready, unavailable, failed]}
        trashed: {type: boolean}
        storageLayoutVersion: {type: integer, description: Server storage layout marker; clients must not infer filesystem paths from it}
        positionMs: {type: integer, format: int64}
        positionContentVersion: {type: integer, format: int64}
    RevisionRequest:
      type: object
      required: [expectedRevision]
      properties: {expectedRevision: {type: integer, format: int64, minimum: 1}}
    AssetUpdate:
      type: object
      required: [expectedRevision]
