        aliases: {type: array, maxItems: 100, items: {type: string}}
        homepage: {type: string, maxLength: 2000}
        acquisitionSources: {type: array, nullable: true, maxItems: 100, items: {type: string, maxLength: 2000}, description: 'User acquisition channels; distinct from original works and public profile links'}
        batchId: {type: string}
    Author:
      allOf:
        - {$ref: '#/components/schemas/AuthorCreate'}
