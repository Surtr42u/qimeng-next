      operationId: appendUpload
      parameters:
        - {name: Upload-Offset, in: header, required: true, schema: {type: integer, format: int64, minimum: 0}}
      requestBody: {required: true, content: {application/octet-stream: {schema: {type: string, format: binary}}}}
      responses:
        '200': {description: Saved offset; chunks are at most 8 MiB, content: {application/json: {schema: {$ref: '#/components/schemas/Upload'}}}}
        default: {$ref: '#/components/responses/Error'}
  /research-artifacts/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      operationId: getResearchArtifact
      responses:
        '200': {description: Bounded preview metadata with original upload identity, content: {application/json: {schema: {$ref: '#/components/schemas/ResearchArtifact'}}}}
        default: {$ref: '#/components/responses/Error'}
  /research-artifacts/{id}/content:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      operationId: getResearchArtifactContent
      responses:
        '200': {description: Authenticated research preview, content: {image/jpeg: {schema: {type: string, format: binary}}}}
        default: {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
    sessionCookie: {type: apiKey, in: cookie, name: qimeng_session}
  parameters:
    FixedTag: {name: tag, in: query, schema: {type: string}, description: 'Fixed tag route constraint; AND with tags/tagMode rather than folded into that selectable group'}
    DirectoryFilter: {name: directory, in: query, schema: {type: string}, description: 'Exact library-relative directory; empty string is the root and omission disables this filter. Requires libraryId.'}
    RecursiveFilter: {name: recursive, in: query, schema: {type: boolean, default: false}, description: 'When directory is present include descendants; default returns only direct files'}
    IncludeDisabled: {name: includeDisabled, in: query, schema: {type: boolean, default: false}, description: 'Explicit management browsing of disabled libraries; ordinary browse/search hides them while statistics and direct details remain available'}
    TZOffsetMinutes: {name: tzOffsetMinutes, in: query, schema: {type: integer, minimum: -840, maximum: 840, default: 0}, description: 'Client local offset east of UTC in minutes: UTC+8=480 and UTC-5=-300. Applies to file-date buckets and calendar filters.'}
    ViewRange: {name: viewRange, in: query, schema: {type: string, enum: [all, none, low, mid, high], default: all}, description: 'none=0; low=1–5 inclusive; mid=5–20 inclusive; high>20'}
    PlayRange: {name: playRange, in: query, schema: {type: string, enum: [all, none, low, mid, high], default: all}, description: 'none=0; low=1–5 inclusive; mid=5–20 inclusive; high>20'}
    SizeRange: {name: sizeRange, in: query, schema: {type: string, enum: [all, lt1m, m1to10, m10to50, gt50m], default: all}, description: 'MB buckets use 1048576 bytes. <1 and >50 are exclusive; 1–10 and 10–50 are inclusive.'}
    AssetSort: {name: sort, in: query, schema: {type: string, enum: [default, fileDate, addedDate, views, plays, size, name, favorited, added_desc, updated_desc, name_asc], default: default}, description: Default is original file date. favorited requires favorite=true; unknown dates sort last in either direction.}
    AssetOrder: {name: order, in: query, schema: {type: string, enum: [asc, desc], default: desc}}
    AuthorIDs: {name: authorIds, in: query, style: form, explode: true, schema: {type: array, maxItems: 50, items: {type: string}}, description: OR within this dimension; AND with other dimensions}
    SourceIDs: {name: sourceIds, in: query, style: form, explode: true, schema: {type: array, maxItems: 50, items: {type: string}}, description: Stable original-work identities; __other__ selects regular assets without a source}
    CharacterIDs: {name: characterIds, in: query, style: form, explode: true, schema: {type: array, maxItems: 50, items: {type: string}}}
    CosWorkIDs: {name: cosWorkIds, in: query, style: form, explode: true, schema: {type: array, maxItems: 50, items: {type: string}}}
    WorkKeys: {name: workKeys, in: query, style: form, explode: true, schema: {type: array, maxItems: 50, items: {type: string}}, description: Opaque works-row facet keys; OR between selected regular sources and COS authors}
    RoleKeys: {name: roleKeys, in: query, style: form, explode: true, schema: {type: array, maxItems: 50, items: {type: string}}, description: Opaque roles-row facet keys; OR between characters and COS directory works}
    TagNames: {name: tags, in: query, style: form, explode: true, schema: {type: array, maxItems: 100, items: {type: string}}}
    TagMode: {name: tagMode, in: query, schema: {type: string, enum: [any, all], default: any}}
    HistorySubset: {name: history, in: query, schema: {type: boolean}, description: Filter by existence of an original view event; applies to all facet rows}
    MinimumViews: {name: minViews, in: query, schema: {type: integer, format: int64, minimum: 0}}
    MaximumViews: {name: maxViews, in: query, schema: {type: integer, format: int64, minimum: 0}}
    MinimumPlays: {name: minPlays, in: query, schema: {type: integer, format: int64, minimum: 0}}
    MaximumPlays: {name: maxPlays, in: query, schema: {type: integer, format: int64, minimum: 0}}
    MinimumSize: {name: minSize, in: query, schema: {type: integer, format: int64, minimum: 0}}
    MaximumSize: {name: maxSize, in: query, schema: {type: integer, format: int64, minimum: 0}}
    TimeRange: {name: timeRange, in: query, schema: {type: string, enum: [all, today, week, month, three_months, year, year_range], default: all}, description: 'File-date interval in the requested client offset, inclusive lower bound and exclusive following-day/year bound'}
    FromYear: {name: fromYear, in: query, schema: {type: integer, minimum: 1970, maximum: 9999}}
    ToYear: {name: toYear, in: query, schema: {type: integer, minimum: 1970, maximum: 9999}}
    ProfileBlockName: {name: block, in: path, required: true, schema: {type: string, enum: [x, basic, accounts]}}
    ExpectedRevision: {name: expectedRevision, in: query, required: true, schema: {type: integer, format: int64, minimum: 1}}
    StatsRange: {name: range, in: query, schema: {type: string, enum: [7d, day, 30d, 90d, week, month, quarter, year, all], default: 7d}}
    Id: {name: id, in: path, required: true, schema: {type: string}}
    PlanId: {name: planId, in: path, required: true, schema: {type: string}}
    Cursor: {name: cursor, in: query, schema: {type: string}}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 128}}
  responses:
    Error:
      description: Explicit failure. 409 means re-read current state; retry unchanged idempotent operations with the same key.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  schemas:
    ResearchArtifact:
      type: object
      required: [id, artifactRef, uploadId, sourceSha256, sha256, mimeType, size, positionSeconds, expiresAt]
      properties:
        id: {type: string}
        artifactRef: {type: string}
        uploadId: {type: string}
        sourceSha256: {type: string}
        sha256: {type: string}
        mimeType: {type: string, enum: [image/jpeg]}
        size: {type: integer, format: int64}
        positionSeconds: {type: number, format: double}
        expiresAt: {type: string, format: date-time}
    ResearchMaterials:
      type: object
      required: [uploadId, sourceSha256, width, height, durationMs, probeState, artifacts, businessWrites, limitations]
      properties:
        uploadId: {type: string}
        sourceSha256: {type: string}
        width: {type: integer}
        height: {type: integer}
        durationMs: {type: integer, format: int64}
        probeState: {type: string}
        artifacts: {type: array, maxItems: 3, items: {$ref: '#/components/schemas/ResearchArtifact'}}
        businessWrites: {type: integer, enum: [0]}
        limitations: {type: array, items: {type: string}}
    DelegatedBudgetUpdate:
      type: object
      required: [maxCalls, expiresInSeconds]
      properties:
        maxCalls: {type: integer, minimum: 10, maximum: 10000}
        expiresInSeconds: {type: integer, minimum: 60, maximum: 86400}
    DelegatedBudget:
      type: object
      required: [calls, maxCalls, deadline]
      properties:
        calls: {type: integer}
        maxCalls: {type: integer}
        deadline: {type: string, format: date-time}
    AIDelegationPolicy:
      type: object
      required: [label, libraryIds, authorIds, allAuthors, allowedFields, candidateBlocks, allowClear, canIngest, canResearch, canOrganize, maxResearchCalls, maxUpdates, maxTasksPerDay, validDays]
      properties:
        label: {type: string, minLength: 1, maxLength: 80}
        libraryIds: {type: array, maxItems: 100, uniqueItems: true, description: 'Permitted intake write targets; reads remain global', items: {type: string}}
        authorIds: {type: array, maxItems: 100, uniqueItems: true, description: 'Permitted author write targets unless allAuthors; reads remain global', items: {type: string}}
        allAuthors: {type: boolean}
        allowedFields: {type: array, maxItems: 4, uniqueItems: true, items: {type: string, enum: [name, biography, homepage, aliases]}}
        candidateBlocks: {type: array, maxItems: 3, uniqueItems: true, items: {type: string, enum: [x, basic, accounts]}}
        allowClear: {type: boolean}
        canIngest: {type: boolean}
        canResearch: {type: boolean}
        canOrganize: {type: boolean}
        canRecycleSources: {type: boolean, default: false, description: Separate opt-in to source recycling after independently verified backup; never permanent deletion. Requires an intake library scope.}
        maxResearchCalls: {type: integer, minimum: 0, maximum: 100}
        maxUpdates: {type: integer, minimum: 1, maximum: 10}
        maxTasksPerDay: {type: integer, minimum: 1, maximum: 200}
        validDays: {type: integer, minimum: 1, maximum: 365}
        maxCallsPerTask: {type: integer, minimum: 10, maximum: 10000, default: 100}
        taskSeconds: {type: integer, minimum: 60, maximum: 86400, default: 3600}
    AIDelegation:
      allOf:
        - {$ref: '#/components/schemas/AIDelegationPolicy'}
        - type: object
          required: [id, state, createdAt, expiresAt]
          properties:
            id: {type: string}
            state: {type: string, enum: [active, revoked, expired]}
            createdAt: {type: string, format: date-time}
            expiresAt: {type: string, format: date-time}
    AIDelegationPage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AIDelegation'}}
        nextCursor: {type: string}
    AIDelegationCreated:
      type: object
      required: [delegation, credential]
      properties:
        delegation: {$ref: '#/components/schemas/AIDelegation'}
        credential: {$ref: '#/components/schemas/Session'}
    DelegatedTaskStart:
      type: object
      required: [kind, label, credentialSecret]
      properties:
        kind: {type: string, enum: [intake, author]}
        label: {type: string, minLength: 1, maxLength: 80}
        libraryId: {type: string}
        batchId: {type: string}
        mode: {type: string, enum: [ordinary, intelligent]}
        maxResearchCalls: {type: integer, minimum: 0, maximum: 100}
        authorId: {type: string}
        expectedRevision: {type: integer, format: int64}
        allowedFields: {type: array, items: {type: string, enum: [name, biography, homepage, aliases]}}
        candidateBlocks: {type: array, items: {type: string, enum: [x, basic, accounts]}}
        allowClear: {type: boolean}
        maxUpdates: {type: integer, minimum: 1, maximum: 10}
        credentialSecret: {type: string, writeOnly: true, minLength: 43, maxLength: 43, description: Trusted executor generates 32 random bytes encoded as unpadded base64url; never a model argument}
    DelegatedTaskResume:
      type: object
      required: [credentialSecret]
      properties:
        credentialSecret: {type: string, writeOnly: true, minLength: 43, maxLength: 43}
    DelegatedTask:
      type: object
      required: [taskId, kind, credential]
      properties:
        taskId: {type: string}
        kind: {type: string, enum: [intake, author]}
        batch: {$ref: '#/components/schemas/Batch'}
        authorTask: {$ref: '#/components/schemas/AuthorTask'}
        credential: {$ref: '#/components/schemas/Session'}
    ActivityRankingItem:
      type: object
      required: [id, name, views, plays, seconds, assets, value]
      properties:
        id: {type: string}
        name: {type: string}
        views: {type: integer, format: int64}
        plays: {type: integer, format: int64}
        seconds: {type: integer, format: int64}
        assets: {type: integer, format: int64}
        value: {type: integer, format: int64}
        asset: {$ref: '#/components/schemas/Asset'}
    ActivityRankingPage:
      type: object
      required: [items, range, metric]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ActivityRankingItem'}}
        nextCursor: {type: string}
        range: {type: string}
        metric: {type: string, enum: [views, seconds]}
    AuthorTaskPage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AuthorTask'}}
        nextCursor: {type: string}
    AuthorTaskCreate:
      type: object
      required: [authorId, expectedRevision, allowedFields, allowClear]
      properties:
        authorId: {type: string}
        expectedRevision: {type: integer, format: int64}
        allowedFields: {type: array, maxItems: 4, uniqueItems: true, items: {type: string, enum: [name, biography, homepage, aliases]}}
        candidateBlocks: {type: array, maxItems: 3, uniqueItems: true, items: {type: string, enum: [x, basic, accounts]}}
        allowClear: {type: boolean}
        maxUpdates: {type: integer, minimum: 1, maximum: 10, default: 1}
        expiresInSeconds: {type: integer, minimum: 60, maximum: 86400, default: 3600}
    AuthorTask:
      type: object
      required: [id, authorId, expectedRevision, allowedFields, allowClear, maxUpdates, usedUpdates, state, expiresAt, createdAt]
      properties:
        id: {type: string}
        authorId: {type: string}
        expectedRevision: {type: integer, format: int64}
        allowedFields: {type: array, items: {type: string}}
        candidateBlocks: {type: array, items: {type: string, enum: [x, basic, accounts]}}
        allowClear: {type: boolean}
        maxUpdates: {type: integer}
        usedUpdates: {type: integer}
        state: {type: string, enum: [authorized, completed, cancelled, expired]}
        expiresAt: {type: string, format: date-time}
        createdAt: {type: string, format: date-time}
    AuthorTaskContext:
      type: object
      required: [task, author, nextActions]
      properties:
        task: {$ref: '#/components/schemas/AuthorTask'}
        author: {$ref: '#/components/schemas/Author'}
        nextActions: {type: array, items: {type: string}}
    RecommendationWeights:
      type: object
      required: [tagRelevance, tagCollection, engagement, recency, likeScore, discovery, freshness, browseDepth, maxRandom]
      properties:
        tagRelevance: {type: number, format: double, minimum: 0, maximum: 1}
        tagCollection: {type: number, format: double, minimum: 0, maximum: 1}
        engagement: {type: number, format: double, minimum: 0, maximum: 1}
        recency: {type: number, format: double, minimum: 0, maximum: 1}
        likeScore: {type: number, format: double, minimum: 0, maximum: 1}
        discovery: {type: number, format: double, minimum: 0, maximum: 1}
        freshness: {type: number, format: double, minimum: 0, maximum: 1}
        browseDepth: {type: number, format: double, minimum: 0, maximum: 1}
        maxRandom: {type: number, format: double, minimum: 0, maximum: 1}
    RecommendationPreferences:
      type: object
      required: [revision, weights, presets]
      properties:
        revision: {type: integer, format: int64}
        weights: {$ref: '#/components/schemas/RecommendationWeights'}
        presets: {type: object, additionalProperties: {$ref: '#/components/schemas/RecommendationWeights'}}
    RecommendationPreferencesUpdate:
      type: object
      required: [expectedRevision, weights]
      properties: {expectedRevision: {type: integer, format: int64}, weights: {$ref: '#/components/schemas/RecommendationWeights'}}
    RecommendationPage:
      type: object
      required: [items, snapshotId]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Asset'}}
        nextCursor: {type: string}
        snapshotId: {type: string}
    RankedAsset:
      type: object
      required: [asset, score]
      properties: {asset: {$ref: '#/components/schemas/Asset'}, score: {type: integer, format: int64}}
    RankingPage:
      type: object
      required: [items]
      properties: {items: {type: array, items: {$ref: '#/components/schemas/RankedAsset'}}, nextCursor: {type: string}}
    ActivityTotals:
      type: object
      required: [views, plays, seconds]
      properties:
        views: {type: integer, format: int64}
        plays: {type: integer, format: int64}
        seconds: {type: integer, format: int64}
    ActivityDimension:
      type: object
      required: [key, views, plays, seconds, assets, bytes]
      properties:
        key: {type: string}
        views: {type: integer, format: int64}
        plays: {type: integer, format: int64}
        seconds: {type: integer, format: int64}
        assets: {type: integer, format: int64}
        bytes: {type: integer, format: int64}
    StatsOverview:
      type: object
      required: [range, inventory, totals, activeDays, viewedAssets, viewedAuthors, viewedTags, averageViewsPerFile, mediaTypes, sources]
      properties:
        range: {type: string}
        inventory: {$ref: '#/components/schemas/Stats'}
        totals: {$ref: '#/components/schemas/ActivityTotals'}
        activeDays: {type: integer}
        viewedAssets: {type: integer}
        viewedAuthors: {type: integer}
        viewedTags: {type: integer}
        averageViewsPerFile: {type: number, format: double, nullable: true}
        mediaTypes: {type: array, items: {$ref: '#/components/schemas/ActivityDimension'}}
        sources: {type: array, items: {$ref: '#/components/schemas/ActivityDimension'}}
    TrendBucket:
      type: object
      required: [start, end, label, views, plays, seconds, mediaTypes, sources]
      properties:
        start: {type: string, format: date-time}
        end: {type: string, format: date-time}
        label: {type: string}
        views: {type: integer, format: int64}
        plays: {type: integer, format: int64}
        seconds: {type: integer, format: int64}
        mediaTypes: {type: array, items: {$ref: '#/components/schemas/TrendDimension'}}
        sources: {type: array, items: {$ref: '#/components/schemas/TrendDimension'}}
    TrendDimension:
      type: object
      required: [key, views, plays, seconds]
      properties:
        key: {type: string}
        views: {type: integer, format: int64}
        plays: {type: integer, format: int64}
        seconds: {type: integer, format: int64}
    StatsTrends:
      type: object
      required: [range, granularity, items]
      properties:
        range: {type: string}
        granularity: {type: string, enum: [day, week, month, quarter, year]}
        items: {type: array, items: {$ref: '#/components/schemas/TrendBucket'}}
    ReviewHour:
      type: object
      required: [hour, views, seconds, imageSeconds, animatedSeconds, videoSeconds]
      properties:
        hour: {type: integer}
        views: {type: integer, format: int64}
        seconds: {type: integer, format: int64}
        imageSeconds: {type: integer, format: int64}
        animatedSeconds: {type: integer, format: int64}
        videoSeconds: {type: integer, format: int64}
    InterestChange:
      type: object
      required: [kind, id, name, currentShare, previousShare, changePoints, currentViews, previousViews]
      properties:
        kind: {type: string, enum: [author, tag]}
        id: {type: string}
        name: {type: string}
        currentShare: {type: number, format: double, description: 'Percentage 0–100; multiple associations are not mutually exclusive'}
        previousShare: {type: number, format: double, description: 'Percentage 0–100; multiple associations are not mutually exclusive'}
        changePoints: {type: number, format: double}
        currentViews: {type: integer, format: int64}
        previousViews: {type: integer, format: int64}
    TopInterests:
      type: object
      required: [range, items]
      properties:
        range: {type: string}
        items:
          type: array
          maxItems: 3
          items:
            type: object
            required: [kind, id, name, views]
            properties:
              kind: {type: string, enum: [author, tag]}
              id: {type: string}
              name: {type: string}
              views: {type: integer, format: int64, minimum: 1}
    BrowsingReview:
      type: object
      required: [range, fromDay, toDay, previousFromDay, previousToDay, viewCount, previousViewCount, firstViews, returnViews, distinctAssets, activeDays, totalSeconds, imageSeconds, animatedSeconds, videoSeconds, comparisonAvailable, hours, changes]
      properties:
        range: {type: string}
        fromDay: {type: string, description: First server-local date inclusive; empty for all}
        toDay: {type: string, description: Current server-local date inclusive}
        previousFromDay: {type: string, description: Previous equal calendar window start; empty for all}
        previousToDay: {type: string, description: Previous equal calendar window end inclusive; empty for all}
        viewCount: {type: integer, format: int64, minimum: 0}
        previousViewCount: {type: integer, format: int64, minimum: 0}
        firstViews: {type: integer, format: int64}
        returnViews: {type: integer, format: int64}
        distinctAssets: {type: integer}
        activeDays: {type: integer}
        comparisonAvailable: {type: boolean}
        totalSeconds: {type: integer, format: int64}
        imageSeconds: {type: integer, format: int64, minimum: 0}
        animatedSeconds: {type: integer, format: int64, minimum: 0}
        videoSeconds: {type: integer, format: int64, minimum: 0, description: Detail dwell time; not playback duration}
        hours: {type: array, minItems: 24, maxItems: 24, items: {$ref: '#/components/schemas/ReviewHour'}}
        changes: {type: array, maxItems: 6, items: {$ref: '#/components/schemas/InterestChange'}}
    Error:
      type: object
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
        currentRevision: {type: integer, format: int64}
        details: {type: object, additionalProperties: true, description: Bounded structured conflict evidence; includes explicit truncation when applicable}
    Instance:
      type: object
      required: [id, name, apiVersion, capabilities]
      properties:
        id: {type: string}
        name: {type: string}
        apiVersion: {type: string}
        capabilities:
          type: object
          required: [aiConfigured, recommendations, rankings, stats, backups, migration]
          properties:
            aiConfigured: {type: boolean}
            recommendations: {type: boolean}
            rankings: {type: boolean}
            stats: {type: boolean}
            backups: {type: boolean}
            migration: {type: boolean}
    SessionCreate:
      type: object
      required: [label]
      description: Supply exactly one of password or token. Password is accepted only here and exchanged for a separate revocable session; it is never a Bearer API credential.
      properties:
        token: {type: string, maxLength: 1024, description: Trusted bootstrap or existing owner device session}
        password: {type: string, maxLength: 1024, description: Configured login password; owner bootstrap also accepted for initial trusted setup}
        label: {type: string, maxLength: 80}
    CredentialCreate:
      type: object
      required: [label, scopes]
      properties:
        label: {type: string, maxLength: 80}
        batchId: {type: string}
        authorTaskId: {type: string, description: 'Exactly one of batchId and authorTaskId is required'}
        scopes: {type: array, items: {type: string, enum: [read, ingest, research, organize, author.profile.write, source.cleanup]}}
    Session:
      type: object
      required: [id, label, scopes, expiresAt]
      properties:
        id: {type: string}
        token: {type: string, description: Only returned on creation}
        label: {type: string}
        scopes: {type: array, items: {type: string}}
        batchId: {type: string}
        authorTaskId: {type: string}
        parentDelegationId: {type: string}
        generation: {type: integer, format: int64}
        expiresAt: {type: string, format: date-time}
    LibraryLocation:
      type: object
      required: [storageId, rootRelativePath, rootPath]
      properties:
        storageId: {type: string}
        rootRelativePath: {type: string}
        rootPath: {type: string, description: Private host path shown only to the owner; do not log or include in telemetry}
    LibraryCreate:
      type: object
      required: [name, kind]
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        kind: {type: string, enum: [regular, cos]}
        storageId: {type: string, default: data, description: Logical root preconfigured by the trusted operator}
        rootRelativePath: {type: string, description: Existing or new folder within the selected external root; the built-in data storage assigns its own isolated library folder}
    Library:
      allOf:
        - {$ref: '#/components/schemas/LibraryCreate'}
        - type: object
          required: [id, enabled, revision, createdAt, fileCount, scanState]
          properties:
            id: {type: string}
            enabled: {type: boolean}
            revision: {type: integer, format: int64}
            createdAt: {type: string, format: date-time}
            fileCount: {type: integer, format: int64, minimum: 0, description: Indexed assets outside trash, including disabled libraries}
            scanState: {type: string, enum: [idle, scanning, error]}
            latestScanId: {type: string}
    NamingContext:
      type: object
      required: [policyVersion, libraryId, directory, family, numberClass, nextWorkNumber, width, separator, namespaceFingerprint, reserved]
      properties:
        policyVersion: {type: string}
        libraryId: {type: string}
        directory: {type: string}
        family: {type: string}
        numberClass: {type: string, enum: [image, video]}
