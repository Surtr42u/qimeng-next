        note: {type: string, maxLength: 10000}
        source: {type: string, maxLength: 200}
        sourceIds: {type: array, maxItems: 20, items: {type: string}}
        acquisitionSources: {type: array, maxItems: 100, items: {type: string, maxLength: 2000}}
        characterIds: {type: array, maxItems: 50, items: {type: string}}
        characters: {type: array, maxItems: 50, items: {type: string, maxLength: 200}}
