        directory: {type: string}
        family: {type: string}
        mediaType: {type: string, enum: [image, animated_image, video]}
        sourceIds: {type: array, maxItems: 20, items: {type: string}}
        characterIds: {type: array, maxItems: 50, items: {type: string}}
        collectionId: {type: string}
        assetId: {type: string}
        expectedRevision: {type: integer, format: int64}
        items: {type: array, minItems: 1, maxItems: 100, items: {$ref: '#/components/schemas/NamingInputItem'}}
    NamingPreviewItem:
      type: object
