        biography: {type: string, maxLength: 20000}
        homepage: {type: string, maxLength: 2000}
        aliases: {type: array, maxItems: 100, items: {type: string}}
        following: {type: boolean}
        acquisitionSources: {type: array, maxItems: 100, items: {type: string, maxLength: 2000}, description: 'Administrator-only whole channel set; explicit [] clears and expectedRevision protects the replacement'}
