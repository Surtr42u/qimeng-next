        originalFileName: {type: string, minLength: 1, maxLength: 1024}
        sourceRelativePath: {type: string, maxLength: 4096}
        size: {type: integer, format: int64, minimum: 1, description: Omit only when the trusted picker cannot determine the source length yet}
