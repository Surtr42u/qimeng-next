    get:
      operationId: getBatchProtection
      parameters: [{$ref: '#/components/parameters/Id'}, {name: protectionId, in: path, required: true, schema: {type: string}}]
      responses:
        '200': {description: Bound manifest and per-input outcomes, content: {application/json: {schema: {$ref: '#/components/schemas/BatchProtection'}}}}
        default: {$ref: '#/components/responses/Error'}
  /batches/{id}/protections/{protectionId}/retry:
    post:
      operationId: retryBatchProtection
      description: Retry the same captured input versions and checkpoint. It never adopts later media versions.
      parameters: [{$ref: '#/components/parameters/Id'}, {name: protectionId, in: path, required: true, schema: {type: string}}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '202': {description: Original protection queued for recovery, content: {application/json: {schema: {$ref: '#/components/schemas/BatchProtection'}}}}
        default: {$ref: '#/components/responses/Error'}
  /batches/{id}/protections/{protectionId}/cleanup-permits:
    post:
      operationId: issueSourceCleanupPermit
      description: Trusted executor only; requires the separate source.cleanup scope. Re-verifies the independent snapshot and exact input bytes before issuing a short-lived recycle permit. This does not delete or recycle anything.
      parameters: [{$ref: '#/components/parameters/Id'}, {name: protectionId, in: path, required: true, schema: {type: string}}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inputId, expectedHash, sourceSize]
              properties:
                inputId: {type: string}
                expectedHash: {type: string, pattern: '^[a-f0-9]{64}$'}
                sourceSize: {type: integer, format: int64, minimum: 1}
      responses:
        '201': {description: Exact source recycle permit, content: {application/json: {schema: {$ref: '#/components/schemas/SourceCleanupPermit'}}}}
        default: {$ref: '#/components/responses/Error'}
  /batches/{id}/cleanup-permits:
    get:
      operationId: listSourceCleanupPermits
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}, {name: inputId, in: query, schema: {type: string}}]
      responses:
        '200': {description: Caller-owned permits for authoritative recovery, content: {application/json: {schema: {$ref: '#/components/schemas/SourceCleanupPermitPage'}}}}
        default: {$ref: '#/components/responses/Error'}
  /cleanup-permits/{id}:
    get:
      operationId: getSourceCleanupPermit
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '200': {description: Caller-owned permit and optional durable receipt, content: {application/json: {schema: {$ref: '#/components/schemas/SourceCleanupPermit'}}}}
        default: {$ref: '#/components/responses/Error'}
  /cleanup-permits/{id}/receipt:
    post:
      operationId: recordSourceCleanupReceipt
      description: Record a trusted executor's actual source outcome. A newer lease generation of the same credential may recover a lost receipt; that does not authorize a new filesystem action. Recycled requires an opaque provider receipt and never an absolute source path.
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SourceCleanupReceiptInput'}}}
      responses:
        '200': {description: Durable source outcome, content: {application/json: {schema: {$ref: '#/components/schemas/SourceCleanupPermit'}}}}
        default: {$ref: '#/components/responses/Error'}
  /migration/v2/imports:
    get:
      operationId: listV2Imports
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {description: Administrator-only staged legacy v2 inputs, content: {application/json: {schema: {$ref: '#/components/schemas/V2ImportPage'}}}}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: stageV2Import
      description: Administrator-only. Validate and retain the exact v2 document without changing media or metadata. Media originals must first be registered and scanned. sourceId identifies the source installation across repeated exports; appIdentifier is not an installation identity.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {name: sourceId, in: query, required: true, schema: {type: string, minLength: 8, maxLength: 128}}
      requestBody: {required: true, content: {application/octet-stream: {schema: {type: string, format: binary, description: 'Complete UTF-8 qimeng_backup schemaVersion 2 JSON, at most 64 MiB'}}}}
      responses:
        '201': {description: Validated immutable input; no business import yet, content: {application/json: {schema: {$ref: '#/components/schemas/V2Import'}}}}
        default: {$ref: '#/components/responses/Error'}
  /migration/v2/imports/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      operationId: getV2Import
      responses:
        '200': {description: Input counts and digest, content: {application/json: {schema: {$ref: '#/components/schemas/V2Import'}}}}
        default: {$ref: '#/components/responses/Error'}
  /migration/v2/imports/{id}/document:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      operationId: downloadV2Import
      responses:
        '200': {description: 'Original exact source bytes, including fields not applied to Next', content: {application/json: {schema: {type: string, format: binary}}}}
        default: {$ref: '#/components/responses/Error'}
  /migration/v2/imports/{id}/plans:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      operationId: prepareV2Migration
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/V2PlanCreate'}}}}
      responses:
        '201': {description: Read-only plan; unique media matches are proposals until this fingerprint is committed, content: {application/json: {schema: {$ref: '#/components/schemas/V2MigrationPlan'}}}}
        default: {$ref: '#/components/responses/Error'}
  /migration/v2/plans/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      operationId: getV2MigrationPlan
      responses:
        '200': {description: Durable plan and bounded report, content: {application/json: {schema: {$ref: '#/components/schemas/V2MigrationPlan'}}}}
        default: {$ref: '#/components/responses/Error'}
  /migration/v2/plans/{id}/items:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      operationId: listV2MigrationItems
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {description: Every source media record has a decision; stable plan order, content: {application/json: {schema: {$ref: '#/components/schemas/V2MigrationItemPage'}}}}
        default: {$ref: '#/components/responses/Error'}
  /migration/v2/plans/{id}/authors:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      operationId: listV2MigrationAuthors
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {description: Author identity and profile preservation decisions, content: {application/json: {schema: {$ref: '#/components/schemas/V2MigrationAuthorPage'}}}}
        default: {$ref: '#/components/responses/Error'}
  /migration/v2/plans/{id}/commit:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      operationId: commitV2Migration
      description: Administrator-only reviewed migration. Revalidates revisions and target original hashes, creates a pre-import database checkpoint, then applies metadata atomically. Never changes or deletes original media. Source settings cannot start network work or rewrite storage roots.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [fingerprint, acceptSkipped], properties: {fingerprint: {type: string}, acceptSkipped: {type: boolean, description: Explicitly accept the unmatched or conflict items listed in this plan}}}}}
      responses:
        '200': {description: Committed or partial migration with checkpoint and per-record report; repeat returns original plan result, content: {application/json: {schema: {$ref: '#/components/schemas/V2MigrationPlan'}}}}
        default: {$ref: '#/components/responses/Error'}
