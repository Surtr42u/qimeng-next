        eventId: {type: string, minLength: 1, maxLength: 4096, description: 'Original portable or live event identity; never reconstructed during migration'}
        kind: {type: string, enum: [view, play, progress, dwell]}
        sessionId: {type: string}
        seconds: {type: number, format: double, minimum: 0}
        occurredAt: {type: string, format: date-time}
        contentVersion: {type: integer, format: int64, minimum: 0, description: 'Zero means the source event carried no content version; it does not identify the current file version'}
        positionMs: {type: integer, format: int64, minimum: 0}
