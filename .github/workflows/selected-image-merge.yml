name: Owner-selected native image merge
on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/selected-image-merge-*']
    paths: &merge_paths
      - '.github/workflows/selected-image-merge.yml'
      - 'tools/selected-merge/**'
      - 'server/cmd/qimeng-merge-selected/**'
      - 'server/internal/assetmerge/**'
      - 'server/internal/store/migrations/0045_*.sql'
      - 'server/internal/service/selected*.go'
      - 'server/internal/service/backup*.go'
      - 'server/internal/storage/**'
      - 'docs/selected-image-merge.md'
  pull_request:
    paths: *merge_paths
permissions: {contents: read}
jobs:
  native:
    name: Selected image restore, publication and replay (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, platform: linux-amd64, ext: ''}
          - {os: windows-2025, platform: windows-amd64, ext: '.exe'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      CGO_ENABLED: '0'
      SUFFIX: ${{ matrix.ext }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {path: next, persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Surtr42u/qimeng-media
          ref: d0215962bb1e9c29baabeed9fc9dc5c8b4b94555
          path: reference
          sparse-checkout: server/migrations
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with: {go-version-file: next/server/go.mod, cache-dependency-path: next/server/go.sum}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}
      - name: Build native command, restore boundary and same-revision service
        shell: bash
        run: |
          python -m pip install PyYAML==6.0.3
          python next/tools/generate_sdks.py --target go
          mkdir product synthetic
          cd next/server
          go test -mod=readonly -count=1 ./internal/architecture ./internal/assetmerge/...
          go build -mod=readonly -trimpath -o "../../product/qimeng-merge-selected$SUFFIX" ./cmd/qimeng-merge-selected
          go build -mod=readonly -trimpath -o "../../product/qimeng-backup$SUFFIX" ./cmd/qimeng-backup
          go build -mod=readonly -trimpath -o "../../synthetic/qimeng-next$SUFFIX" ./cmd/qimeng
          go build -mod=readonly -trimpath -o "../../synthetic/qimeng-legacy-convert$SUFFIX" ./cmd/qimeng-legacy-convert
      - name: Exercise private restore, refusal, service, archive and replay with synthetic images
        shell: bash
        run: python next/tools/selected-merge/smoke.py --migrations reference/server/migrations --bin product --fixture-bin synthetic --receipt product/cloud-receipt.json
      - name: Package verified native executables
        shell: bash
        run: |
          cp next/docs/selected-image-merge.md product/README.md
          cd product
          sha256sum "qimeng-merge-selected$SUFFIX" "qimeng-backup$SUFFIX" README.md cloud-receipt.json > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qimeng-selected-image-merge-${{ matrix.platform }}
          path: product/
          if-no-files-found: error
          retention-days: 14
