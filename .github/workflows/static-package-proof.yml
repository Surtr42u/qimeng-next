name: Measure traffic from published static packages
on:
  push:
    branches: [proof/packaged-static-gzip]
permissions:
  contents: read
  actions: read
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: 44483277173
          github-token: ${{ github.token }}
          name: qimeng-next-package-linux-amd64
          path: build/baseline
      - run: python tools/proof_packaged_baseline.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: baseline-static-http, path: build/baseline-http.json, if-no-files-found: error}
