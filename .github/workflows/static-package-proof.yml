name: Measure traffic from published static packages
on:
  push:
    branches: [proof/packaged-static-gzip]
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: 44483277173
          github-token: ${{ github.token }}
          name: qimeng-next-package-linux-amd64
          path: build/baseline
      - run: python tools/proof_packaged_baseline.py
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: 44488450557
          github-token: ${{ github.token }}
          name: qimeng-next-package-linux-amd64
          path: build/candidate
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24', cache: npm, cache-dependency-path: web/package-lock.json}
      - working-directory: web
        run: |
          npm ci
          npx --no-install playwright install --with-deps --only-shell chromium
      - run: |
          if ! command -v tcpdump >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y tcpdump; fi
          python tools/proof_packaged_compare.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: packaged-static-traffic
          path: |
            build/baseline-http.json
            build/static-comparison.json
            build/browser-static-*.json
          if-no-files-found: error
