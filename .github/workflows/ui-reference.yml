name: Installed Web UI comparison
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ui-reference.yml'
      - 'web/tests/ui-reference*.mjs'
      - 'web/src/**'
      - 'web/package-lock.json'
      - 'ui/react/**'
permissions:
  contents: read
  actions: read
concurrency:
  group: installed-web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      REFERENCE_SHA: 745974081716a9d69a95002a41220e35e743d764
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: next
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Surtr42u/qimeng-media
          ref: '745974081716a9d69a95002a41220e35e743d764'
          path: installed
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: b6b3a62b0ecc3049e27dc50e6ae9a663021d6e10
          path: baseline
          persist-credentials: false
      - name: Verify source identity
        run: |
          test "$(git -C installed rev-parse HEAD)" = "$REFERENCE_SHA"
          test "$(git -C next rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            installed/web/package-lock.json
            next/web/package-lock.json
      - name: Build installed Web from its own protocol and lockfile
        working-directory: installed/web
        run: |
          npm ci
          npm exec -- openapi-ts -f src/api/openapi-ts.config.ts
          npm run build
          git diff --exit-code
      - name: Build candidate and install one shared Chromium
        working-directory: next/web
        run: |
          npm ci
          npm run generate:api
          npm run build
          npx playwright install --only-shell chromium
      - name: Build the immediate Next baseline on the same runner
        working-directory: baseline/web
        run: |
          test "$(git rev-parse HEAD)" = b6b3a62b0ecc3049e27dc50e6ae9a663021d6e10
          npm ci
          npm run generate:api
          npm run build
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: web-dist
          path: first-proposal
          run-id: 44480244422
          github-token: ${{ github.token }}
      - name: Compare reachable fields and actions on the first offline visit
        working-directory: next/web
        env:
          BASELINE_DIST: ${{ github.workspace }}/baseline/web/dist
          FIRST_PROPOSAL_DIST: ${{ github.workspace }}/first-proposal
          CANDIDATE_DIST: ${{ github.workspace }}/next/web/dist
          COMPARISON_DIR: ${{ github.workspace }}/evidence
        run: node tests/route-offline-study.mjs
      - name: Install the same Ubuntu reference font by its signed package digest
        run: |
          set -euo pipefail
          pkg=$(apt-cache show fonts-noto-cjk)
          file=$(awk '$1 == "Filename:" {print $2; exit}' <<< "$pkg")
          digest=$(awk '$1 == "SHA256:" {print $2; exit}' <<< "$pkg")
          test -n "$file" && test -n "$digest"
          output="$RUNNER_TEMP/reference-cjk.deb"
          for base in https://archive.ubuntu.com/ubuntu https://azure.archive.ubuntu.com/ubuntu https://security.ubuntu.com/ubuntu; do
            if curl --fail --location --max-time 65 --silent --show-error "$base/$file" -o "$output" &&
               echo "$digest  $output" | sha256sum --check --status; then
              sudo dpkg -i "$output"
              fc-match -f '%{family}\n' 'sans-serif:lang=zh-cn'
              exit 0
            fi
          done
          exit 1
      - name: Exercise both built entry points
        working-directory: next/web
        env:
          REFERENCE_DIST: ${{ github.workspace }}/installed/web/dist
          CANDIDATE_DIST: ${{ github.workspace }}/next/web/dist
          COMPARISON_DIR: ${{ github.workspace }}/evidence
        run: node tests/ui-reference.mjs
      - name: Measure cold and repeat secondary navigation on the same Chromium
        if: success() || failure()
        working-directory: next/web
        env:
          REFERENCE_DIST: ${{ github.workspace }}/installed/web/dist
          BASELINE_DIST: ${{ github.workspace }}/baseline/web/dist
          CANDIDATE_DIST: ${{ github.workspace }}/next/web/dist
          COMPARISON_DIR: ${{ github.workspace }}/evidence
        run: node tests/route-loading-study.mjs
      - name: Publish measurements to run summary
        if: always()
        run: |
          if test -f evidence/report.md; then cat evidence/report.md >> "$GITHUB_STEP_SUMMARY"; fi
          if test -f evidence/route-loading.md; then cat evidence/route-loading.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: installed-web-comparison
          path: evidence/
          retention-days: 7
          if-no-files-found: warn
