name: Assemble and open native server packages
on: {workflow_call: {}}
permissions: {contents: read}
jobs:
  package:
    name: Server package (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: windows-amd64, runner: windows-2025, suffix: '.exe'}
          - {target: linux-amd64, runner: ubuntu-24.04, suffix: ''}
          - {target: linux-arm64, runner: ubuntu-24.04-arm, suffix: ''}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: generated-contracts-and-locks, path: .}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: web-first-check, path: build/web-artifact}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with: {go-version-file: server/go.mod, cache-dependency-path: server/go.sum}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - name: Build portable native binaries
        working-directory: server
        shell: bash
        env: {CGO_ENABLED: '0', BINARY_SUFFIX: '${{ matrix.suffix }}'}
        run: |
          mkdir -p ../build/package-bin
          go build -mod=readonly -trimpath -o "../build/package-bin/qimeng-next$BINARY_SUFFIX" ./cmd/qimeng
          go build -mod=readonly -trimpath -o "../build/package-bin/qimeng-backup$BINARY_SUFFIX" ./cmd/qimeng-backup
      - name: Package same-commit web and native binaries
        run: python tools/package_server.py --target ${{ matrix.target }} --web build/web-artifact/dist --bin build/package-bin --output build/server-packages
      - name: Prepare locked browser driver
        working-directory: web
        shell: bash
        run: |
          npm ci
          if [[ "$RUNNER_OS" == Linux ]]; then npx --no-install playwright install --with-deps --only-shell chromium; fi
      - name: Open the packaged login and home and restore an empty archive
        run: python tools/smoke_server_package.py --target ${{ matrix.target }} --packages build/server-packages
      - name: Open the NAS Compose package with separate persistent mounts
        if: runner.os == 'Linux'
        run: python tools/smoke_server_package.py --target ${{ matrix.target }} --packages build/server-packages --compose
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qimeng-next-package-${{ matrix.target }}
          retention-days: 14
          if-no-files-found: error
          path: |
            build/server-packages/*.zip
            build/server-packages/*.sha256
            build/server-packages/*-smoke.json
            build/server-packages/*-home.png
