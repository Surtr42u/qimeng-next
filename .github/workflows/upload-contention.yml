name: Concurrent edits during video upload completion
on:
  workflow_dispatch:
    inputs:
      before_next:
        description: Optional full SHA to compare on this same runner
        required: false
        type: string
  push:
    branches: [main, codex/upload-contention]
    paths:
      - '.github/workflows/upload-contention.yml'
      - 'tools/upload-contention/**'
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env: {CGO_ENABLED: '0'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {path: next, persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: inputs.before_next
        with: {path: before, ref: '${{ inputs.before_next }}', persist-credentials: false}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with: {go-version-file: next/server/go.mod, cache-dependency-path: next/server/go.sum}
      - name: Install real media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}
      - run: python -m pip install PyYAML==6.0.3
      - name: Exercise the two device sessions against each production binary
        env: {BEFORE_NEXT: '${{ inputs.before_next }}'}
        run: |
          python next/tools/generate_sdks.py --target go
          (cd next/server && go build -mod=readonly -trimpath -o "$RUNNER_TEMP/next-server" ./cmd/qimeng)
          previous=()
          if [[ -n "$BEFORE_NEXT" ]]; then
            python before/tools/generate_sdks.py --target go
            test "$(git -C before rev-parse HEAD)" = "$BEFORE_NEXT"
            (cd before/server && go build -mod=readonly -trimpath -o "$RUNNER_TEMP/before-server" ./cmd/qimeng)
            previous+=("$RUNNER_TEMP/before-server")
          fi
          python3 next/tools/upload-contention/measure.py "$RUNNER_TEMP/next-server" evidence "${previous[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: video-upload-concurrent-edit, path: evidence/, if-no-files-found: warn, retention-days: 14}
