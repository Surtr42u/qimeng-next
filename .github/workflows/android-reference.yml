name: Installed Android UI reference
on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/bootstrap/**']
    paths:
      - 'android/baseline/**'
      - '.github/workflows/android-reference.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: installed-android-reference-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env: {ANDROID_SERIAL: emulator-5556}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with: {go-version: '1.27.4', cache: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with: {packages: 'platform-tools'}
      - name: Prepare tools and dedicated AVD storage
        run: |
          bash tools/prepare_android_runner.sh
          sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
          sudo apt-get update && sudo apt-get install -y make ffmpeg python3-pil
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify published APK and build the fixed old server
        env: {GH_TOKEN: '${{ github.token }}'}
        run: bash android/baseline/prepare.sh
      - uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          avd-name: qimeng_api35
          disk-size: 2048M
          emulator-port: 5556
          disable-animations: false
          emulator-options: '-no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim'
          script: bash android/baseline/capture.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: installed-android-ui-reference
          path: android/build/installed-ui-baseline/
          retention-days: 14
          if-no-files-found: warn
