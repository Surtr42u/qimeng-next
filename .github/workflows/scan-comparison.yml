name: Installed and Next scan comparison
on:
  workflow_dispatch:
    inputs:
      before_next:
        description: Optional full SHA of an earlier Next server to time on the same machine
        type: string
        required: false
  push:
    branches: [main, codex/scan-comparison]
    paths:
      - '.github/workflows/scan-comparison.yml'
      - 'tools/scan-comparison/**'
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      REFERENCE_SHA: 745974081716a9d69a95002a41220e35e743d764
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {path: next, persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Surtr42u/qimeng-media
          ref: ${{ env.REFERENCE_SHA }}
          path: installed
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: inputs.before_next
        with:
          ref: ${{ inputs.before_next }}
          path: before
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: next/server/go.mod
          cache-dependency-path: |
            installed/server/go.sum
            next/server/go.sum
      - name: Build both production servers
        run: |
          test "$(git -C installed rev-parse HEAD)" = "$REFERENCE_SHA"
          test "$(git -C next rev-parse HEAD)" = "$GITHUB_SHA"
          make -C installed sdk-go
          (cd installed/server && go build -mod=readonly -trimpath -o "$RUNNER_TEMP/installed-server" ./cmd/qimeng)
          (cd next/server && go build -mod=readonly -trimpath -o "$RUNNER_TEMP/next-server" ./cmd/qimeng)
      - name: Submit and observe manual scans
        env:
          BEFORE_NEXT: ${{ inputs.before_next }}
        run: |
          extra=()
          if [[ -n "$BEFORE_NEXT" ]]; then
            test "$(git -C before rev-parse HEAD)" = "$BEFORE_NEXT"
            (cd before/server && go build -mod=readonly -trimpath -o "$RUNNER_TEMP/before-server" ./cmd/qimeng)
            extra+=("$RUNNER_TEMP/before-server")
          fi
          python3 next/tools/scan-comparison/compare.py "$RUNNER_TEMP/installed-server" "$RUNNER_TEMP/next-server" evidence "${extra[@]}"
      - name: Compare identity when file timestamps and content disagree
        run: python3 next/tools/scan-comparison/identity_check.py "$RUNNER_TEMP/installed-server" "$RUNNER_TEMP/next-server" evidence
      - name: Sample the scan functions after the timing trials
        working-directory: next/server
        run: |
          go test -mod=readonly -run '^TestUnchangedLibraryScanCountsEveryFileWithoutPerFileCatalogWrites$' -count=12 -cpuprofile="$RUNNER_TEMP/scan.cpu" -o "$RUNNER_TEMP/scan.test" ./internal/httpapi
          go tool pprof -list='service\.\(\*Service\)\.(scanFile|scanMissing|scanSignatures|walkLibrary)$' "$RUNNER_TEMP/scan.test" "$RUNNER_TEMP/scan.cpu" > ../../evidence/scan-function-samples.txt
      - name: Check new matches, manual author removal and identity after a move
        run: '"$RUNNER_TEMP/scan.test" -test.v -test.run "^(TestScanningNewAuthorRuleMatchAndLaterManualRemoval|TestScanRegistersExistingFileAndConservesIdentityAfterExternalMove)$"'
      - name: Verify partial commits, cancellation and missing-file reconciliation
        working-directory: next/server
        run: go test -mod=readonly -count=1 -v -run '^TestScan(Batch|Missing|Known|Signatures)' ./internal/service
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: installed-next-scan-comparison
          path: evidence/
          retention-days: 14
          if-no-files-found: warn
