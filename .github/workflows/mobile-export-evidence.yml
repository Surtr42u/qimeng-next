name: Offline mobile export evidence
on:
  workflow_dispatch:
  push:
    branches: [main, codex/offline-mobile-export-recovery]
    paths: &evidence_paths
      - '.github/workflows/mobile-export-evidence.yml'
      - 'tools/mobile-export-recovery/**'
      - 'docs/mobile-export-recovery.md'
  pull_request:
    paths: *evidence_paths
permissions: {contents: read}
jobs:
  readback:
    name: Prepare and independently read back synthetic originals (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}
      - name: Check identities, archived sections, ambiguous evidence, changes and idempotence
        run: python -m unittest discover -s tools/mobile-export-recovery -p test_recovery.py -v
