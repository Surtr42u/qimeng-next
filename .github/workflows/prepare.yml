name: Cloud verification
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Checks to run on this revision
        type: choice
        options: [all, contracts, backend, web, android, windows]
        default: all
      refresh_locks:
        description: Refresh dependency locks and collect the resulting files
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:
    paths-ignore: ['**/*.md']
permissions:
  contents: read
concurrency:
  group: prepare-${{ github.ref }}
  cancel-in-progress: true
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with: {go-version-file: server/go.mod, cache: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '17'}
      - name: Install pinned development tools
        run: |
          python -m pip install PyYAML==6.0.3 uv==0.13.8
      - name: Refresh JavaScript locks on explicit request
        if: inputs.refresh_locks
        run: |
          npm --prefix web install --package-lock-only --ignore-scripts
          npm --prefix tools/mcp-compat install --package-lock-only --ignore-scripts
      - run: npm --prefix web ci
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: build/toolchain/openapi-generator-cli-*.jar
          key: openapi-cli-${{ hashFiles('tools/generate_sdks.py') }}
      - name: Generate protocol clients
        run: python tools/generate_sdks.py
      - name: Resolve Go module checksums
        working-directory: server
        run: go mod tidy
      - name: Lock AI runtime dependencies
        run: uv pip compile ai/requirements.in --generate-hashes -o ai/requirements.lock
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: generated-contracts-and-locks
          retention-days: 7
          if-no-files-found: error
          path: |
            api/sdk.lock
            api/generated/
            web/package-lock.json
            web/src/api/generated/
            server/go.mod
            server/go.sum
            server/internal/transport/generated/
            ai/requirements.lock
            tools/mcp-compat/package-lock.json
  lock-check:
    needs: generate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: generated-contracts-and-locks, path: .}
      - name: Match SDK sources and dependency locks to this commit
        run: |
          git ls-files --error-unmatch api/sdk.lock server/go.mod server/go.sum web/package-lock.json ai/requirements.lock tools/mcp-compat/package-lock.json desktop/package-lock.json desktop/src-tauri/Cargo.lock
          git diff --exit-code -- api/sdk.lock server/go.mod server/go.sum web/package-lock.json ai/requirements.lock tools/mcp-compat/package-lock.json
  server-runtime:
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || (inputs.suite == 'backend' || inputs.suite == 'web' || inputs.suite == 'android')
    needs: generate
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: generated-contracts-and-locks, path: .}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with: {go-version-file: server/go.mod, cache-dependency-path: server/go.sum}
      - name: Build Linux runtime for independent client checks
        working-directory: server
        run: |
          go build -trimpath -o ../build/qimeng-next ./cmd/qimeng
          go build -trimpath -o ../build/qimeng-backup ./cmd/qimeng-backup
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-runtime
          retention-days: 7
          path: build/
          if-no-files-found: error
  server:
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'backend'
    needs: generate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: generated-contracts-and-locks, path: .}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with: {go-version-file: server/go.mod, cache-dependency-path: server/go.sum}
      - name: Install media dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Verify Go as committed
        working-directory: server
        run: |
          go mod tidy
          go vet ./...
          go test -race -timeout 180s -v ./...
          go test -tags=qimeng_native_sqlite,sqlite_omit_load_extension -timeout 180s ./internal/store ./internal/service ./internal/httpapi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: server-first-check
          retention-days: 7
          path: |
            server/go.mod
            server/go.sum
  web:
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'web'
    needs: generate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: generated-contracts-and-locks, path: .}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24', cache: npm, cache-dependency-path: web/package-lock.json}
      - name: Build and test browser client
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm test
          npx playwright install --with-deps chromium webkit
          npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: web-first-check
          retention-days: 7
          path: |
            web/dist/
            web/test-results/**/*.png
  server-packages:
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'all'
    needs: web
    uses: ./.github/workflows/server-packages.yml
  ai:
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'backend'
    needs: generate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: generated-contracts-and-locks, path: .}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}
      - name: Check execution boundaries and package
        env: {PYTHONPATH: ai/src}
        run: |
          python -m pip install --require-hashes -r ai/requirements.lock
          python -m unittest discover -s ai/tests -v
          python tools/package_ai.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ai-first-check
          path: build/qimeng-next-ai.zip
          retention-days: 7
  android:
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'android'
    needs: generate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: generated-contracts-and-locks, path: .}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with: {gradle-version: '9.7.0'}
      - name: Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with: {packages: 'platform-tools'}
      - name: Install Android compilation SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Compile and verify Android
        run: |
          gradle --no-daemon -p android -Pqimeng.embedded=false -I "$GITHUB_WORKSPACE/android/architecture/verify.gradle" verifyClientArchitecture :app:testClientDebugUnitTest :core:model:test :core:data:testDebugUnitTest :core:ui:testDebugUnitTest :app:lintClientDebug --stacktrace
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-first-check
          retention-days: 7
          path: |
            android/**/build/reports/
            android/app/build/outputs/apk/client/debug/*.apk
  android-native:
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'android'
    needs: generate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: generated-contracts-and-locks, path: .}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with: {go-version-file: server/go.mod, cache-dependency-path: server/go.sum}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with: {packages: 'platform-tools'}
      - name: Install pinned native toolchain
        run: |
          sdkmanager 'ndk;28.2.13676358'
          sudo apt-get update && sudo apt-get install -y meson ninja-build nasm pkg-config
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: build/android-media-cache/${{ matrix.abi }}
          key: android-media-${{ runner.os }}-${{ matrix.abi }}-${{ hashFiles('tools/android-native.lock.json', 'tools/build_android_native.py') }}
      - name: Build the actual ABI from pinned upstream source
        run: python tools/build_android_native.py '${{ matrix.abi }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-native-${{ matrix.abi }}
          path: build/android-native/
          if-no-files-found: error
          retention-days: 7
  android-embedded:
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'android'
    needs: [generate, android-native]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: generated-contracts-and-locks, path: .}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {pattern: 'android-native-*', merge-multiple: true, path: '${{ runner.temp }}/android-native'}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with: {gradle-version: '9.7.0'}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with: {packages: 'platform-tools'}
      - name: Compile embedded variant with verified native outputs
        run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;28.2.13676358'
          python tools/stage_android_native.py "$RUNNER_TEMP/android-native"
          gradle --no-daemon -p android :app:assembleEmbeddedDebug :app:testEmbeddedDebugUnitTest :embedded:testDebugUnitTest :app:lintEmbeddedDebug --stacktrace
          python tools/check_android_apk.py embedded android/app/build/outputs/apk/embedded/debug/app-embedded-debug.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-embedded-check
          retention-days: 7
          path: |
            android/**/build/reports/
            android/app/build/outputs/apk/embedded/debug/*.apk
  live:
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'web'
    needs: [generate, server-runtime, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: generated-contracts-and-locks, path: .}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: linux-runtime, path: '${{ runner.temp }}/server-artifact/build'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: web-first-check, path: web}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - name: Prepare isolated integrations
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python -m pip install --require-hashes -r ai/requirements.lock
          npm --prefix web ci
          cd web && npx playwright install --with-deps chromium
      - name: Real Go + stdio MCP + browser
        run: bash tools/cloud_live.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: live-integration-evidence
          retention-days: 7
          path: web/test-results/**/live-synthetic-*.png
          if-no-files-found: ignore
  mcp-compat:
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'backend'
    needs: [generate, server-runtime]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: generated-contracts-and-locks, path: .}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: linux-runtime, path: '${{ runner.temp }}/server-artifact/build'}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - name: Install the media tools used by the intake fixtures
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install independent MCP clients
        run: |
          python -m pip install --require-hashes -r ai/requirements.lock
          npm --prefix tools/mcp-compat ci
      - name: Real stdio intake and independent client matrix
        run: bash tools/cloud_mcp.sh
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with: {go-version-file: server/go.mod, cache-dependency-path: server/go.sum}
      - name: Real stdio research with a restricted synthetic TLS provider
        working-directory: server
        run: QIMENG_PROVIDER_MCP_PYTHON="$(command -v python)" go test -run '^TestPublicProviderStdioMCP$' -count=1 -v ./internal/service
  hermes:
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'backend'
    needs: [generate, server-runtime]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: NousResearch/hermes-agent
          ref: ae2a81ccc00e9b7c06301523e5bb09608397149c
          path: build/hermes-upstream
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: generated-contracts-and-locks, path: .}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: linux-runtime, path: '${{ runner.temp }}/server-artifact/build'}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}
      - name: Install the isolated stdio executor
        run: |
          python -m venv "$RUNNER_TEMP/qai-venv"
          "$RUNNER_TEMP/qai-venv/bin/python" -m pip install --require-hashes -r ai/requirements.lock
          echo "QIMENG_MCP_PYTHON=$RUNNER_TEMP/qai-venv/bin/python" >> "$GITHUB_ENV"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.14'}
      - name: Run the official Hermes CLI in a synthetic profile
        working-directory: build/hermes-upstream
        run: |
          python -m pip install uv==0.13.8
          uv sync --frozen --no-default-groups --extra mcp --python "$(command -v python)"
          uv pip install --python .venv/bin/python pytest==9.1.1
          PYTHONPATH="$PWD" .venv/bin/python "$GITHUB_WORKSPACE/tools/mcp-compat/hermes_smoke.py"
  windows:
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'windows'
    needs: generate
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: generated-contracts-and-locks, path: .}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with: {go-version-file: server/go.mod, cache-dependency-path: server/go.sum}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with: {toolchain: '1.100.0'}
      - name: Verify native filesystem semantics
        working-directory: server
        run: |
          go test -timeout 180s ./...
          if ($LASTEXITCODE -ne 0) { throw 'Windows Go tests failed' }
          go build -trimpath -o ../build/qimeng-next.exe ./cmd/qimeng
          if ($LASTEXITCODE -ne 0) { throw 'Windows Go build failed' }
          go build -trimpath -o ../build/qimeng-backup.exe ./cmd/qimeng-backup
          if ($LASTEXITCODE -ne 0) { throw 'Windows backup utility build failed' }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: ${{ !cancelled() }}
        with: {python-version: '3.13'}
      - name: Verify Windows trusted source recycle semantics
        if: ${{ !cancelled() }}
        env: {PYTHONPATH: ai/src}
        run: |
          python -m pip install --require-hashes -r tools/mcp-compat/windows-recycle.lock
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Windows recycle provider installation failed' }
          python -m unittest discover -s ai/tests -p test_cleanup.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Windows source recycle checks failed' }
      - name: Build native connection shell
        if: ${{ !cancelled() }}
        working-directory: desktop
        run: |
          if ('${{ inputs.refresh_locks }}' -eq 'true') {
            npm install --package-lock-only --ignore-scripts
            if ($LASTEXITCODE -ne 0) { throw 'Desktop dependency resolution failed' }
            cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
            if ($LASTEXITCODE -ne 0) { throw 'Cargo dependency resolution failed' }
          }
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'Desktop dependency install failed' }
          npm run icons
          if ($LASTEXITCODE -ne 0) { throw 'Icon generation failed' }
          cargo test --manifest-path src-tauri/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { throw 'Desktop tests failed' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Desktop build failed' }
          node tests/cloud-webview.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Native WebView2 window smoke failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-first-check
          retention-days: 7
          path: |
            build/qimeng-next.exe
            build/qimeng-backup.exe
            desktop/package-lock.json
            desktop/src-tauri/Cargo.lock
            desktop/src-tauri/target/release/bundle/
            build/desktop-evidence/
  android-ui:
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'android'
    needs: [generate, android, server-runtime]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env: {ANDROID_SERIAL: emulator-5556}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: generated-contracts-and-locks, path: .}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
