name: Prepare locked toolchain and SDKs
on:
  workflow_dispatch:
  push:
    branches: ['codex/bootstrap/**']
permissions:
  contents: read
concurrency:
  group: prepare-${{ github.ref }}
  cancel-in-progress: true
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with: {go-version-file: server/go.mod, cache: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '17'}
      - name: Resolve pinned development tools in cloud
        run: |
          python -m pip install PyYAML==6.0.3 uv==0.13.8
          npm --prefix web install --package-lock-only --ignore-scripts
          npm --prefix web ci
      - name: Generate protocol clients
        run: python tools/generate_sdks.py
      - name: Resolve Go module checksums
        working-directory: server
        run: go mod tidy
      - name: Lock AI runtime dependencies
        run: uv pip compile ai/requirements.in --generate-hashes -o ai/requirements.lock
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: generated-contracts-and-locks
          retention-days: 7
          if-no-files-found: error
          path: |
            api/sdk.lock
            api/generated/
            web/package-lock.json
            web/src/api/generated/
            server/go.mod
            server/go.sum
            server/internal/transport/generated/
            ai/requirements.lock
