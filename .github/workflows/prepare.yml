name: Prepare locked toolchain and SDKs
on:
  workflow_dispatch:
  push:
    branches: ['codex/bootstrap/**']
permissions:
  contents: read
concurrency:
  group: prepare-${{ github.ref }}
  cancel-in-progress: true
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with: {go-version-file: server/go.mod, cache: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '17'}
      - name: Resolve pinned development tools in cloud
        run: |
          python -m pip install PyYAML==6.0.3 uv==0.13.8
          npm --prefix web install --package-lock-only --ignore-scripts
          npm --prefix web ci
      - name: Generate protocol clients
        run: python tools/generate_sdks.py
      - name: Resolve Go module checksums
        working-directory: server
        run: go mod tidy
      - name: Lock AI runtime dependencies
        run: uv pip compile ai/requirements.in --generate-hashes -o ai/requirements.lock
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: generated-contracts-and-locks
          retention-days: 7
          if-no-files-found: error
          path: |
            api/sdk.lock
            api/generated/
            web/package-lock.json
            web/src/api/generated/
            server/go.mod
            server/go.sum
            server/internal/transport/generated/
            ai/requirements.lock
  server:
    needs: generate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: generated-contracts-and-locks, path: .}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with: {go-version-file: server/go.mod, cache-dependency-path: server/go.sum}
      - name: Install media dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Format and verify Go
        working-directory: server
        run: |
          gofmt -w .
          git diff -- '*.go' > ../build-format.patch
          go mod tidy
          go vet ./...
          go test -race -timeout 180s ./...
          go build -trimpath -o ../build/qimeng-next ./cmd/qimeng
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: server-first-check
          retention-days: 7
          path: |
            build-format.patch
            build/qimeng-next
            server/go.mod
            server/go.sum
  web:
    needs: generate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: generated-contracts-and-locks, path: .}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24', cache: npm, cache-dependency-path: web/package-lock.json}
      - name: Build and test browser client
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm test
          npx playwright install --with-deps chromium webkit
          npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: web-first-check
          retention-days: 7
          path: |
            web/dist/
            web/test-results/
            web/playwright-report/
  ai:
    needs: generate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: generated-contracts-and-locks, path: .}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}
      - name: Check execution boundaries and package
        env: {PYTHONPATH: ai/src}
        run: |
          python -m pip install --require-hashes -r ai/requirements.lock
          python -m unittest discover -s ai/tests -v
          python tools/package_ai.py
          python tools/check_docs.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ai-first-check
          path: build/qimeng-next-ai.zip
          retention-days: 7
  android:
    needs: generate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: generated-contracts-and-locks, path: .}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with: {gradle-version: '8.11.1'}
      - name: Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - name: Install API 35 packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile and verify Android
        run: gradle --no-daemon -p android :app:assembleDebug :app:testDebugUnitTest :core:model:test :core:data:testDebugUnitTest :core:ui:testDebugUnitTest :app:lintDebug --stacktrace
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-first-check
          retention-days: 7
          path: |
            android/**/build/reports/
            android/app/build/outputs/apk/debug/*.apk
