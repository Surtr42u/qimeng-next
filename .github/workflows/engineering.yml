name: Engineering checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: engineering-${{ github.ref }}
  cancel-in-progress: true
jobs:
  standards:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history for exposed credentials and private paths
        env:
          SCANNER_VERSION: 8.30.1
          SCANNER_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          package="gitleaks_${SCANNER_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --retry 2 --max-time 120 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${SCANNER_VERSION}/${package}" \
            --output "$RUNNER_TEMP/$package"
          echo "$SCANNER_SHA256  $RUNNER_TEMP/$package" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/$package" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact=100 --no-banner \
            --ignore-gitleaks-allow --max-archive-depth=3 --max-decode-depth=3 --log-opts="--all --full-history -m" .
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with: {go-version-file: server/go.mod, cache: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}
      - name: Check document navigation and guard regression examples
        run: |
          python -m unittest discover -s tools -p test_engineering_checks.py -v
          python tools/check_docs.py
      - name: Verify published migrations and identify affected documentation
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          base="${PR_BASE:-${PUSH_BASE:-}}"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            if [[ "$GITHUB_REF_NAME" == "$DEFAULT_BRANCH" ]]; then
              base="$(git rev-parse --verify -q HEAD^ || true)"
            else
              base="$(git merge-base HEAD "origin/$DEFAULT_BRANCH")"
            fi
          fi
          python tools/check_migration_history.py "$base"
          python tools/check_doc_impact.py "$base"
      - name: Check production import boundaries for all OS source files
        working-directory: server
        run: go test -count=1 ./internal/architecture
      - name: Check the committed Go source
        working-directory: server
        run: |
          git ls-files -z -- '*.go' | xargs -0 -r gofmt -l > "$RUNNER_TEMP/unformatted.txt"
          if [[ -s "$RUNNER_TEMP/unformatted.txt" ]]; then
            cat "$RUNNER_TEMP/unformatted.txt"
            git ls-files -z -- '*.go' | xargs -0 -r gofmt -w
            git diff -- '*.go' > "$RUNNER_TEMP/gofmt.patch"
            exit 1
          fi
      - name: Publish the correction from the failed formatting check
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: go-format-correction
          path: ${{ runner.temp }}/gofmt.patch
          if-no-files-found: ignore
          retention-days: 7
