name: Headless migration acceptance
on:
  push:
    branches: [codex/mobile-headless-acceptance]
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: mobile-migration-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  companion:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      ANDROID_SERIAL: emulator-5556
      BASELINE_RUN: '44543750879'
      BASELINE_SHA: 407ed698528966e73793fa1e00808ee78eb1f3af
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Verify the source of the installed embedded app and SDK
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BASELINE_RUN" --jq .head_sha)" = "$BASELINE_SHA"
          gh run download "$BASELINE_RUN" -n generated-contracts-and-locks -D "$RUNNER_TEMP/generated"
          mkdir -p api/generated
          cp -r "$RUNNER_TEMP/generated/api/generated/kotlin" api/generated/
          gh run download "$BASELINE_RUN" -n android-embedded-check -D "$RUNNER_TEMP/installed"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with: {gradle-version: '9.7.0'}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with: {packages: 'platform-tools'}
      - name: Compile the companion and check its manifest
        run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
          gradle -p android -Pqimeng.migrationTest=acceptance :app:assembleEmbeddedDebugAndroidTest
          mkdir -p "$RUNNER_TEMP/companion"
          keytool -genkeypair -alias cloud -keyalg RSA -keysize 2048 -validity 2 -dname 'CN=Disposable cloud fixture' -keystore "$RUNNER_TEMP/cloud-signing.p12" -storepass android -keypass android
          companion="$RUNNER_TEMP/companion/migration-acceptance.apk"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" sign --ks "$RUNNER_TEMP/cloud-signing.p12" --ks-pass pass:android --out "$companion" android/app/build/outputs/apk/androidTest/embedded/debug/*.apk
          apkanalyzer manifest print "$companion" | python tools/mobile-migration/check_manifest.py
          apkanalyzer dex code --class media.qimeng.next.test.MigrationAcceptance --method 'onStart()V' "$companion" > "$RUNNER_TEMP/acceptance-method"
          test -s "$RUNNER_TEMP/acceptance-method"
          sha256sum "$companion"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: migration-acceptance-apk
          path: ${{ runner.temp }}/companion/migration-acceptance.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Build cloud-only setup and prepare the isolated emulator
        run: |
          gradle -p android -Pqimeng.migrationTest=cloudFixture :app:assembleEmbeddedDebugAndroidTest
          signer="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          "$signer" sign --ks "$RUNNER_TEMP/cloud-signing.p12" --ks-pass pass:android --out "$RUNNER_TEMP/cloud-fixture.apk" android/app/build/outputs/apk/androidTest/embedded/debug/*.apk
          app=$(find "$RUNNER_TEMP/installed" -name app-embedded-debug.apk -type f)
          test -f "$app"
          "$signer" sign --ks "$RUNNER_TEMP/cloud-signing.p12" --ks-pass pass:android --out "$RUNNER_TEMP/cloud-host.apk" "$app"
          bash tools/prepare_android_runner.sh
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify quiescence, readback, and service continuity on Android 35
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          avd-name: qimeng_api35
          disk-size: 2048M
          emulator-port: 5556
          disable-animations: false
          emulator-options: '-no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim'
          script: bash tools/mobile-migration/cloud_smoke.sh
