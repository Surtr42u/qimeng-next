name: Web AI access browser evidence
on:
  push:
    branches: ['proof/ai-access-layout']
permissions:
  contents: read
concurrency:
  group: ai-access-evidence-${{ github.ref }}
  cancel-in-progress: true
env:
  APP_SHA: b3a6a5e5bb3178183c822a8e615d0fe1924598c3
  PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
jobs:
  browser:
    name: ${{ matrix.os }} browser checks and layout
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact application commit and evidence-only overlay
        run: |
          git merge-base --is-ancestor "$APP_SHA" HEAD
          git diff --exit-code "$APP_SHA" HEAD -- . ':(exclude).github/workflows/proof-ai-access-layout.yml' ':(exclude)web/e2e/ai-access-proof.spec.ts'
          echo "Application: $APP_SHA / proof: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the Web entry point from its own protocol and lockfile
        working-directory: web
        run: |
          npm ci
          npm run generate:api
          npm run build
      - name: Prepare the matching Playwright 1.65.1 Noble image and reference CJK font
        id: linux
        if: runner.os == 'Linux'
        run: |
          docker pull "$PLAYWRIGHT_IMAGE"
          mkdir -p "$RUNNER_TEMP/ai-layout-fonts" "$GITHUB_WORKSPACE/evidence"
          font="$RUNNER_TEMP/ai-layout-fonts/NotoSansCJKsc-Regular.otf"
          curl --fail --location --silent --show-error --max-time 90 --retry 1 \
            'https://raw.githubusercontent.com/notofonts/noto-cjk/523d033d6cb47f4a80c58a35753646f5c3608a78/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf' --output "$font"
          test "$(git hash-object "$font")" = 'dc15562470b4f842321894787a0d066879ccff8b'
          cat > "$RUNNER_TEMP/ai-layout-playwright" <<'SH'
          #!/usr/bin/env bash
          set -eu
          docker run --rm --ipc=host -e CI -e GITHUB_SHA -e APP_SHA -e AI_LAYOUT_EVIDENCE=/workspace/evidence \
            -v "$GITHUB_WORKSPACE:/workspace" -v "$RUNNER_TEMP/ai-layout-fonts:/usr/local/share/fonts/ai-layout:ro" \
            -w /workspace/web "$PLAYWRIGHT_IMAGE" bash -ec '
              fc-cache /usr/local/share/fonts/ai-layout
              fc-match "Noto Sans CJK SC:lang=zh-cn"
              exec ./node_modules/.bin/playwright "$@"
            ' _ "$@"
          SH
          chmod +x "$RUNNER_TEMP/ai-layout-playwright"
      - name: Install Windows Chromium
        id: windows
        if: runner.os == 'Windows'
        working-directory: web
        run: npx playwright install chromium
      - name: Run access and settings regressions in desktop Chromium, mobile Chromium and WebKit
        if: runner.os == 'Linux'
        working-directory: web
        run: '"$RUNNER_TEMP/ai-layout-playwright" test e2e/ai-access.spec.ts e2e/settings-parity.spec.ts --project=chromium --project=mobile-chromium --project=webkit --reporter=list --retries=0'
      - name: Run access and settings regressions in Windows Chromium
        if: runner.os == 'Windows'
        working-directory: web
        run: npx playwright test e2e/ai-access.spec.ts e2e/settings-parity.spec.ts --project=chromium --reporter=list --retries=0
      - name: Exercise both viewports and capture the masked interface
        if: ${{ !cancelled() && (steps.linux.outcome == 'success' || steps.windows.outcome == 'success') }}
        env:
          AI_LAYOUT_EVIDENCE: ${{ github.workspace }}/evidence
        working-directory: web
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            "$RUNNER_TEMP/ai-layout-playwright" test e2e/ai-access-proof.spec.ts --project=chromium --reporter=list --retries=0
          else
            npx playwright test e2e/ai-access-proof.spec.ts --project=chromium --reporter=list --retries=0
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() && (steps.linux.outcome == 'success' || steps.windows.outcome == 'success') }}
        with:
          name: ai-access-${{ runner.os }}-views
          path: |
            evidence/*.png
            evidence/*-measurements.json
          if-no-files-found: error
          retention-days: 14
