name: Bounded large synthetic thumbnails
on:
  push:
    branches: [proof/bounded-large-thumbnails]
permissions:
  contents: read
jobs:
  thumbnails:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with: {go-version-file: server/go.mod, cache-dependency-path: server/go.sum}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}
      - run: python -m pip install Pillow==12.0.0 PyYAML==6.0.3
      - name: Generate the Go transport for this revision
        run: python tools/generate_sdks.py --target go
      - name: Produce independently encoded synthetic inputs
        run: |
          mkdir -p build/large-stills
          python server/internal/service/testdata/large_stills.py build/large-stills
          python server/internal/service/testdata/large_stills.py build/large-stills small
          cp build/large-stills/progressive-patches.jpg server/internal/service/testdata/
          cd build/large-stills && sha256sum *.png *.jpg > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synthetic-large-stills
          path: build/large-stills
          retention-days: 3
      - name: Scan and read three thumbnail sizes for each synthetic original
        working-directory: server
        env:
          QIMENG_TEST_LARGE_STILLS: '1'
        run: |
          go mod tidy
          go test -mod=readonly -v -timeout=8m -run 'Test(Large.*|Progressive.*|SelectedImageReadPreview)' ./internal/service
      - name: Collect resolved module files
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: still-proof-go-locks
          path: |
            server/go.mod
            server/go.sum
