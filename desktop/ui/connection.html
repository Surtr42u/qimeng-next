<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>连接绮梦影库</title><link rel="stylesheet" href="connection.css"><script src="connection.js" defer></script></head><body><main><span class="eyebrow">绮梦影库 Next</span><h1>连接你的影库</h1><p>填写 PC 或 NAS 服务的根地址。媒体与账户仍由同一服务器管理。</p><form id="connection"><label for="address">服务器地址</label><input id="address" name="address" type="text" inputmode="url" autocomplete="url" placeholder="https://media.example.test" required><p id="error" role="alert" hidden></p><button id="save" type="submit">保存并连接</button></form><small>可从系统托盘再次打开此窗口。连接壳不保存访问令牌。</small></main></body></html>
