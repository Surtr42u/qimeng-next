<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>连接服务器 · 绮梦影库</title>
  <link rel="stylesheet" href="connection.css" />
  <script src="connection.js" defer></script>
</head>
<body>
  <main class="card">
    <div class="brand"><img src="app-icon.png" alt="" /><h1>绮梦影库</h1></div>
    <p class="sub">连接到你的 NAS 媒体库服务器</p>
    <form id="connection">
      <label for="address">服务器地址</label>
      <input id="address" type="text" placeholder="http://192.0.2.8:8421" inputmode="url" autocomplete="off" spellcheck="false" autofocus required />
      <p class="hint">与手机 App 登录页填同一个地址，服务端默认端口为 8421</p>
      <div id="error" class="error" role="alert" hidden></div>
      <button id="save" type="submit">保存并连接</button>
    </form>
  </main>
</body>
</html>
