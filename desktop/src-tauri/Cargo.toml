[package]
name = "qimeng-next-desktop"
version = "0.1.0"
edition = "2021"
description = "Qimeng Next trusted connection shell"

[build-dependencies]
tauri-build = { version = "=2.7.5", features = [] }

[dependencies]
reqwest = { version = "=0.13.5", default-features = false, features = ["native-tls"] }
tauri = { version = "=2.12.6", features = ["tray-icon", "image-png", "dynamic-acl"] }
tauri-plugin-opener = "=2.7.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
url = "=2.5.8"
